# gateway-1's config during make verify-m4's "5xx" scenario (ADR-0031): one
# upstream of three endpoints, the third the fault-injecting mock
# (upstream-fault, chaos mock), behind one retrying route and no policies.
# Its upstream name is the scenario's own, so each scenario starts with fresh
# health, outlier, breaker and budget state (ADR-0030). Outlier detection,
# the breaker and the retry budget are the defaults.
version: 51
upstreams:
  - name: verify-5xx
    endpoints: # lb unset: p2c (D3)
      - { address: 'upstream-1:8080' }
      - { address: 'upstream-2:8080' }
      - { address: 'upstream-fault:8080' }
    health_check: { path: /status/200, interval: 1s, timeout: 1s, unhealthy: 3, healthy: 2 }
routes:
  - name: verify
    match: { path_prefix: /bytes }
    upstream: verify-5xx
    timeouts: { connect: 1s, per_try: 1s, total: 5s }
    retry: { attempts: 3 }
