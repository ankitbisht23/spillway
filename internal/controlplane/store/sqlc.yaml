# sqlc v1.31.1 (make tools): Go code for queries/*.sql into db/ (ADR-0036).
# make sqlc regenerates it; make lint-api checks it is up to date.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: cidr
            nullable: true
            go_type:
              import: net/netip
              type: Prefix
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
