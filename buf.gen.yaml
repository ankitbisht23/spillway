# make proto: Go code from api/proto into internal/gen (committed; make
# lint-proto checks it is up to date). The plugin comes from ./bin.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/ankitbisht23/spillway
  # ConfigService's client and server (ADR-0038).
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/ankitbisht23/spillway
