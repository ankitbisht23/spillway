      description: >-
        Usage is what the control plane's flusher last wrote to Postgres, so up
        to one flush interval (10 s) behind the gateways; the periods are the
        UTC day and month now. quota is the consumer's effective quota now (its
        quota override that applies, else its plan's in the latest published
        config), 0 for none.
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - name: consumer_id
          in: query
          required: true
          description: The consumers, 1 to 50; repeat the parameter for each.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: integer, format: int64 }
