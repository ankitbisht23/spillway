      operationId: validateConfig
      tags: [config]
      summary: >-
        Validate the config working set as a publish would (CP-03, SEC-06) and
        preview it against the latest published version (UI-02). Validation
        errors are data: the answer is 200 either way, and its ETag is the
        working-set revision that publish's If-Match carries (CP-02)
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      responses:
        '200':
          description: The validation result and the preview
          headers:
            ETag: { $ref: '#/components/headers/RevisionETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigValidation' }
        default: { $ref: '#/components/responses/Error' }
  /config/publish:
    post:
      operationId: publishConfig
      tags: [config]
      summary: >-
        Publish the config working set as a new config version with a change
        note, if it is still at the revision the preview showed (CP-02); the
        working set must pass validation (CP-03)
      x-spillway-roles: [publisher, admin]
      parameters:
        - $ref: '#/components/parameters/RevisionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeNote' }
      responses:
        '200':
          description: The new config version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Nothing to publish, the working set has not changed since the latest version (conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/RevisionPreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
