      tags: [config]
      summary: >-
        What a policy of the latest published config version did, or would
        have done, over a window ending now (UI-01, RL-21, ADR-0060): its
        decisions in shadow and in enforce mode from Prometheus
        (gw_ratelimit_decisions_total, by the policy's published name), and
        its top keys from the heavy-hitter windows (by its ID), with how much
        of the window each source covers. Without Prometheus the counts are
        null and metrics_error says why; the keys still answer
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - name: window
          in: query
          description: The window, ending now; 1h by default.
          schema: { type: string, enum: ['15m', '1h', '24h', '7d'], default: '1h' }
