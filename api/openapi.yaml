        in: path
        required: true
        description: The endpoint's ID.
        schema: { type: integer, format: int64 }
    post:
      operationId: drainEndpoint
      tags: [config]
      summary: Mark an endpoint draining in the config working set; it ships with the next publish. Undrain with a PUT of the upstream
      x-spillway-roles: [editor, admin]
