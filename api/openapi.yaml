              schema: { $ref: '#/components/schemas/ConfigVersionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /config/versions/{v}:
    parameters:
      - $ref: '#/components/parameters/ConfigVersionNumber'
    get:
      operationId: getConfigVersion
      tags: [config]
      summary: Read a published config version with its snapshot (CP-02)
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      responses:
        '200':
          description: The config version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /config/versions/{v}/diff:
    parameters:
      - $ref: '#/components/parameters/ConfigVersionNumber'
    get:
      operationId: diffConfigVersion
      tags: [config]
      summary: The changes from another published version to this one (UI-06)
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - name: against
          in: query
          description: The version to compare with; default v-1. 0 is the empty config before the first version.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: The changes and a unified diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /config/versions/{v}/rollback:
    parameters:
      - $ref: '#/components/parameters/ConfigVersionNumber'
    post:
      operationId: rollbackConfig
      tags: [config]
      summary: >-
        Publish a copy of an earlier config version as a new version and reset
        the config working set to it (CP-04); identity is never rolled back
        (CP-20), and a rollback that identity still refers past is refused
      x-spillway-roles: [publisher, admin]
      parameters:
        - $ref: '#/components/parameters/RevisionIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeNote' }
      responses:
        '200':
          description: The new config version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/RevisionPreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ConfigValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Error' }
  /config/export:
    get:
      operationId: exportConfig
      tags: [config]
      summary: >-
        The config working set, or a published version, as the declarative
        YAML that static mode reads (CP-05): entities sorted by name with their
        ids, fields in proto order; a published version also carries its
        version. Identity is not part of it (ADR-0037)
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - name: version
          in: query
          description: A published version to export instead of the working set.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: >-
            The config as YAML. For the working set, the ETag is its revision,
            which an import's If-Match carries
          headers:
            ETag: { $ref: '#/components/headers/RevisionETag' }
          content:
            application/yaml:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ConfigValidationFailed' }
        default: { $ref: '#/components/responses/Error' }
  /config/import:
    post:
      operationId: importConfig
      tags: [config]
      summary: >-
        Replace the config working set from YAML in export's shape (CP-05),
        if it is still at the revision If-Match names; config still needs a
        publish. Entities are matched by id, then by name, else created;
        rows matched by nothing are deleted. Each entity's rules apply;
        references between entities are checked by validate and publish
        (ADR-0037). Identity is refused; the ratelimit section replaces the
        config settings (ADR-0045)
      x-spillway-roles: [editor, admin]
      parameters:
        - $ref: '#/components/parameters/RevisionIfMatch'
        - name: note
          in: query
          description: An optional note for the audit record (ADR-0040).
          schema: { type: string, minLength: 1, maxLength: 2000 }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string, description: 'At most 10 MiB.' }
      responses:
        '200':
          description: The revision after the import and what it changed
          headers:
            ETag: { $ref: '#/components/headers/RevisionETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigImport' }
        '400':
          description: The body is not YAML, or has a field config.proto does not (invalid_request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412': { $ref: '#/components/responses/RevisionPreconditionFailed' }
        '413':
          description: The body is over 10 MiB (payload_too_large)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: The body is not application/yaml (unsupported_media_type)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            An entity breaks its rules or SEC-06's allow-list, a name or id is
            given twice, an id names no entity of its type, or the file holds
            identity, with one detail per error (validation_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Error' }
  /config/settings:
    get:
      operationId: getConfigSettings
      tags: [config]
      summary: >-
        Read the config settings: the ratelimit section of the working set
        (RL-31, ADR-0045)
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      responses:
        '200':
          description: The config settings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigSettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateConfigSettings
      tags: [config]
      summary: >-
        Replace the config settings in the working set; they ship with the
        next publish and roll back with config (CP-02, ADR-0045)
      x-spillway-roles: [editor, admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigSettings' }
      responses:
        '200':
          description: The replaced config settings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Error' }
  /identity/export:
    get:
      operationId: exportIdentity
      tags: [identity]
      summary: >-
        The identity snapshot that gateways receive, as YAML in the shape of
        config.proto's Identity message (ADR-0037, ADR-0038): the identity
        version, tenants, consumers, keys that are neither revoked nor
        expired as their prefix and SHA-256, access lists, overrides that
        have not ended. For backup and inspection; there is no identity
        import
      x-spillway-roles: [admin]
      responses:
        '200':
          description: The identity as YAML
          content:
            application/yaml:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /replicas:
    get:
      operationId: listReplicas
      tags: [replicas]
      summary: >-
        List gateway replicas by name, from their heartbeats (CP-08,
        ADR-0038): the config and identity versions each runs, its last
        heartbeat and last sync, whether it is live (a heartbeat under 15 s
        old, RL-24) and the last config version it refused. Replicas without
        a heartbeat for 7 days are pruned (CP-22)
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: A page of replicas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplicaList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /heavy-hitters:
    get:
      operationId: listHeavyHitters
      tags: [heavy-hitters]
      summary: >-
        The top throttled keys of a time range (RL-21, ADR-0041): each
        gateway's heartbeats report its top 100 by policy and key digest,
        kept as one-minute windows for 7 days (CP-22). The windows that
        start in [since, until) are summed by policy and key digest and the
        most throttled (denied + shadow_denied) come first. A key digest is
        the 22-character digest of the policy's filled key template keyed
        with the deployment's heavy-hitter secret (ADR-0053), never the key
        itself; only an admin can match it to a subject, with
        lookupHeavyHitters. Counts are exact for keys that every replica
        tracked, and a lower bound otherwise
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - name: since
          in: query
          description: Windows that start at or after this time; by default 15 minutes ago. At most 7 days before until (or now).
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Windows that start before this time; by default none. Without since, since is 15 minutes before it.
          schema: { type: string, format: date-time }
        - name: policy_id
          in: query
          description: Only this policy's keys.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: The top throttled keys, at most limit of them; there is no next page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeavyHitterList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /heavy-hitters/lookup:
    post:
      operationId: lookupHeavyHitters
      tags: [heavy-hitters]
      summary: >-
        The heavy-hitter windows of one subject (RL-21, ADR-0053): the
        control plane fills the policy's key template, as of the latest
        published config version, with the subject's values as a gateway
        would, computes its keyed digest and answers the policy's windows
        under that digest that start in [since, until), newest first. It
        de-pseudonymises a digest, so it is admin only and every lookup
        writes an audit record, which holds the digest but never the
        subject. A POST, so that the subject is in no URL. A template with
        {api_key} cannot be filled here (the control plane keeps only the
        hash of a key's secret part): such windows carry api_key_id
      x-spillway-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeavyHitterLookup' }
      responses:
        '200':
          description: The subject's digest and its windows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeavyHitterLookupResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        default: { $ref: '#/components/responses/Error' }
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: List audit records, newest first (CP-13)
      x-spillway-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: entity
          in: query
          description: Only records of this entity type, such as route, endpoint drains included under upstream.
          schema: { type: string }
        - name: entity_id
          in: query
          description: With entity, only the records of this entity.
          schema: { type: string }
        - name: actor_sub
          in: query
          description: Only the records of this actor, a token's sub.
          schema: { type: string }
        - name: since
          in: query
          description: Only records at or after this time.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Only records before this time.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A page of audit records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      tags: [session]
      summary: >-
        The caller as its token says (UI-04, ADR-0058): its subject, display
        name and Spillway roles, for the admin UI to show and to disable the
        actions those roles cannot take. The server still checks every
        operation's roles; a token without a Spillway role is 403 here too
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /stream:
    get:
      operationId: openStream
      tags: [stream]
      summary: >-
        Live data for one admin UI screen as server-sent events (UI-03,
        RL-21, ADR-0059): each sub names a query of the server's fixed
        catalogue, evaluated once per 5 s per distinct query and parameters
        however many streams watch it; the browser never sends PromQL. The
        token goes in Authorization, never in the URL. The answer is
        text/event-stream: a ready event first (StreamReady), then a result
        (StreamResult) or an error (StreamError) per subscription at each
        evaluation, a ": keepalive" comment every 15 s, and an end event
        (StreamEnd) when the server closes the stream, at the latest at the
        token's exp. Every parameter is validated before the stream starts
        (400 invalid_request, naming the parameter, never its value). At
        most 10 open streams per caller and 200 in all: past either, 503
        unavailable with Retry-After. A client that does not take an event
        within 10 s is disconnected
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - name: sub
          in: query
          required: true
          description: >-
            The subscriptions, 1 to 8 distinct catalogue names, as repeated
            parameters.
            overview.requests: request rate by code_class (matrix; route,
            tenant, range). overview.ratelimited: the share of requests
            rate-limited (matrix; route, tenant, range). overview.latency: p50
            and p99 request duration in seconds, series labelled quantile
            (matrix; route, tenant, range). overview.routes: the top 10 routes
            by request rate over the range, each with stat rps, ratelimited_rps
            and p99_s (vector; tenant, range). overview.tenants: the same by
            tenant (vector; route, range). throttling.policies: the deny rate by
            policy name and mode, shadow would-denies as mode shadow (matrix;
            range). throttling.heavy_hitters: the top 50 throttled keys since
            the range's start (HeavyHitterList; range, policy_id). replicas: the
            gateway replicas with their staleness (StreamReplicas).
            routes.endpoints: each gateway replica's upstream endpoints now,
            by resolved address, with stat healthy (1 while it takes traffic)
            and ejected (1 while outlier detection has it ejected), labelled
            replica, upstream, endpoint and stat (vector; no parameters).
            routes.circuits: each gateway replica's circuit state per upstream
            now, 0 closed, 1 open, 2 half-open, labelled replica and upstream
            (vector; no parameters).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 8
            items: { $ref: '#/components/schemas/StreamQueryName' }
        - name: route
          in: query
          description: >-
            For overview.requests, .ratelimited, .latency and .tenants: a route
            of the latest published config version, or * (the default) for
            every route.
          schema: { type: string, pattern: '^(\*|[A-Za-z0-9._-]{1,64})$' }
        - name: tenant
          in: query
          description: >-
            For overview.requests, .ratelimited, .latency and .routes: a
            tenant's name, none (requests without a tenant), other (tenants
            outside the top 50, OB-01), or * (the default) for every tenant.
          schema: { type: string, pattern: '^(\*|[A-Za-z0-9._-]{1,64})$' }
        - name: range
          in: query
          description: >-
            The time range of the overview, throttling queries: 15m (the
            default), 1h, 6h, 24h or 7d. A range query's step is 15 s, 1 m,
            5 m, 15 m or 1 h.
          schema: { type: string, enum: [15m, 1h, 6h, 24h, 7d] }
        - name: policy_id
          in: query
          description: For throttling.heavy_hitters, only this policy's keys.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: >-
            The event stream. Each event's data is one line of JSON: ready is
            a StreamReady, result a StreamResult, error a StreamError, end a
            StreamEnd
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /demo:
    get:
      operationId: getDemo
      tags: [demo]
      summary: >-
        The demo (SC-08, ADR-0095): its tenants with their plans' limits, the
        Playground's routes with the policy that limits each, and the
        Playground's scenarios, from the latest published config version.
        404 not_found, as for an unknown path, when demo mode is off
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      responses:
        '200':
          description: The demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Demo' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Keycloak access token for the audience spillway-controlplane, of a
        user or of a confidential client's service account (CP-11). Its
        realm_access.roles name the caller's roles: viewer, editor,
        publisher, key-admin, admin (CP-12).
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The entity's ID.
      schema: { type: integer, format: int64 }
    PageLimit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 50 }
    PageCursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page; opaque.
      schema: { type: string }
    NameFilter:
      name: name
      in: query
      description: Only the entity with this name.
      schema: { type: string }
    TenantIdFilter:
      name: tenant_id
      in: query
      description: Only this tenant's consumers.
      schema: { type: integer, format: int64 }
    ConsumerIdFilter:
      name: consumer_id
      in: query
      description: Only this consumer's overrides.
      schema: { type: integer, format: int64 }
    PolicyIdFilter:
      name: policy_id
      in: query
      description: Only the overrides of this policy.
      schema: { type: integer, format: int64 }
    ActionFilter:
      name: action
      in: query
      description: Only entries with this action.
      schema: { type: string, enum: [allow, deny] }
    SubjectTypeFilter:
      name: subject_type
      in: query
      description: Only entries with this subject type.
      schema: { type: string, enum: [key, consumer, cidr] }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The entity's ETag, as its GET answered it (CP-14). Missing is 428; any other value than the current one is 412.
      schema: { type: string }
    RevisionIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The config working-set revision as a strong ETag, "<revision>", as
        validate answered it (CP-02). Missing is 428; any other value than
        the current revision is 412.
      schema: { type: string }
    ConfigVersionNumber:
      name: v
      in: path
      required: true
      description: The config version.
      schema: { type: integer, format: int64 }
  headers:
    NoStore:
      description: no-store, as the answer holds a key that no cache may keep (ADR-0039).
      schema: { type: string }
    ETag:
      description: The entity's version as a strong ETag, "<version>" (CP-14).
      schema: { type: string }
    Location:
      description: The created entity's URL.
      schema: { type: string }
    RevisionETag:
      description: The config working-set revision as a strong ETag, "<revision>" (CP-02).
      schema: { type: string }
  responses:
    BadRequest:
      description: Malformed JSON, an unknown field or a bad parameter (invalid_request)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such entity (not_found)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A name already taken, or an entity still in use (conflict)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: If-Match is not the current version, which details carries (precondition_failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The body is over 1 MiB (payload_too_large)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The body is not application/json (unsupported_media_type)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The entity breaks its rules, or refers to what does not exist (validation_failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match is missing (precondition_required)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RevisionPreconditionFailed:
      description: >-
        If-Match is not the current working-set revision, which details
        carries: the working set changed since the preview (precondition_failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConfigValidationFailed:
      description: >-
        The note is missing or too long, the config fails validation (CP-03,
        SEC-06), with one detail per error, or a rollback's snapshot cannot be
        read by this schema (validation_failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: >-
        Any other error: no or a bad bearer token (unauthenticated, 401, with
        WWW-Authenticate), a token without a role the operation lists
        (forbidden, 403), internal, unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, code, request_id]
      properties:
        error: { type: string, description: A message for people. }
        code:
          type: string
          enum: [invalid_request, unauthenticated, forbidden, not_found, conflict, precondition_failed, payload_too_large, unsupported_media_type, validation_failed, precondition_required, internal, unavailable]
        request_id: { type: string, description: The request's X-Request-Id. }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      properties:
        entity: { type: string }
        id: { type: integer, format: int64 }
        name: { type: string }
        path: { type: string, description: The field at fault, such as health_check.interval. }
        message: { type: string }
        version: { type: integer, format: int64, description: For 412, the entity's current version. }

    # Config entities: config.proto's messages (CP-21), field for field, plus
    # version, created_at and updated_at. A unit test checks the parity.
    Upstream:
      type: object
      additionalProperties: false
      required: [id, name, endpoints, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, description: 'Unique; 1-64 characters from [A-Za-z0-9._-].' }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/Endpoint' }
        lb: { type: string, description: 'round_robin, p2c or consistent_hash; unset means p2c (GW-07).' }
        hash_on: { type: string, description: consistent_hash's key template. }
        health_check: { $ref: '#/components/schemas/HealthCheck' }
        outlier_detection: { $ref: '#/components/schemas/OutlierDetection' }
        circuit: { $ref: '#/components/schemas/CircuitBreaker' }
        retry_budget: { $ref: '#/components/schemas/RetryBudget' }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Endpoint:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        id: { type: integer, format: int64, readOnly: true, description: Kept by a PUT that keeps the address. }
        address: { type: string, description: 'host:port, unique within the upstream.' }
        draining: { type: boolean, description: A draining endpoint gets no new requests. }
    HealthCheck:
      type: object
      additionalProperties: false
      properties:
        path: { type: string }
        interval: { type: string }
        timeout: { type: string }
        unhealthy: { type: integer, format: int32 }
        healthy: { type: integer, format: int32 }
    OutlierDetection:
      type: object
      additionalProperties: false
      properties:
        consecutive_failures: { type: integer, format: int32 }
        base_ejection: { type: string }
        max_ejection: { type: string }
        max_ejected_percent: { type: integer, format: int32 }
    CircuitBreaker:
      type: object
      additionalProperties: false
      properties:
        max_connections: { type: integer, format: int32 }
        max_pending: { type: integer, format: int32 }
        max_concurrent: { type: integer, format: int32 }
        error_rate: { type: number, format: double }
        window: { type: string }
        min_requests: { type: integer, format: int32 }
        open_for: { type: string }
        half_open_probes: { type: integer, format: int32 }
    RetryBudget:
      type: object
      additionalProperties: false
      properties:
        ratio: { type: number, format: double }
        min_per_sec: { type: number, format: double }
    Route:
      type: object
      additionalProperties: false
      required: [id, name, match, upstream, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, description: 'Unique; 1-64 characters from [A-Za-z0-9._-].' }
        match: { $ref: '#/components/schemas/RouteMatch' }
        upstream: { type: string, description: The upstream's name. }
        priority: { type: integer, format: int32 }
        strip_prefix: { type: string }
        add_prefix: { type: string }
        request_headers: { $ref: '#/components/schemas/HeaderTransform' }
        response_headers: { $ref: '#/components/schemas/HeaderTransform' }
        max_body_bytes: { type: integer, format: int64 }
        max_header_bytes: { type: integer, format: int32 }
        timeouts: { $ref: '#/components/schemas/Timeouts' }
        hsts_max_age: { type: string }
        cost: { type: integer, format: int64 }
        retry: { $ref: '#/components/schemas/Retry' }
        auth_mode: { type: string, description: 'none, api_key, jwt or either; unset means none (GW-20).' }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    RouteMatch:
      type: object
      additionalProperties: false
      properties:
        host: { type: string }
        methods:
          type: array
          items: { type: string }
        path: { type: string }
        path_prefix: { type: string }
        headers:
          type: array
          items: { $ref: '#/components/schemas/HeaderMatch' }
    HeaderMatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        exact: { type: string }
        regex: { type: string }
    HeaderTransform:
      type: object
      additionalProperties: false
      properties:
        set:
          type: array
          items: { $ref: '#/components/schemas/HeaderValue' }
        add:
          type: array
          items: { $ref: '#/components/schemas/HeaderValue' }
        remove:
          type: array
          items: { type: string }
    HeaderValue:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        value: { type: string }
    Timeouts:
      type: object
      additionalProperties: false
      properties:
        connect: { type: string }
        per_try: { type: string }
        total: { type: string }
        idle: { type: string }
    Retry:
      type: object
      additionalProperties: false
      properties:
        attempts: { type: integer, format: int32 }
        non_idempotent: { type: boolean }
    Policy:
      type: object
      additionalProperties: false
      required: [id, name, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, description: 'Unique; 1-64 characters from [A-Za-z0-9._-].' }
        level: { type: string, description: 'global, tenant, consumer or route.' }
        match: { $ref: '#/components/schemas/PolicyMatch' }
        key_template: { type: string }
        algorithm: { type: string, description: 'gcra, sliding_window, fixed_window or concurrency.' }
        limits:
          type: array
          items: { $ref: '#/components/schemas/Limit' }
        mode: { type: string, description: 'enforce, shadow or off; unset means enforce.' }
        local: { type: boolean }
        failure_mode: { type: string, description: 'fail_open, fail_closed or degraded.' }
        from_plan: { type: boolean, description: "Takes the limits from the consumer's plan (RL-08)." }
        lease_k:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          description: 'Lease size k for batched mode (RL-18): each gateway reserves up to k cost units per key and serves them locally; 0, the default (left out of responses), means strict. Only for Redis gcra and sliding_window policies, at most every limit''s burst (gcra) or rate (sliding_window); honoured in enforce mode only.'
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PolicyMatch:
      type: object
      additionalProperties: false
      properties:
        routes:
          type: array
          items: { type: string }
        methods:
          type: array
          items: { type: string }
    Limit:
      type: object
      additionalProperties: false
      properties:
        rate: { type: integer, format: int64 }
        period: { type: string }
        burst: { type: integer, format: int64 }
    ConfigSettings:
      type: object
      additionalProperties: false
      required: [ratelimit, version, updated_at]
      description: The config settings (ADR-0045); unset fields mean their defaults.
      properties:
        ratelimit: { $ref: '#/components/schemas/RateLimitSettings' }
        version: { type: integer, format: int64, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    RateLimitSettings:
      type: object
      additionalProperties: false
      properties:
        replicas:
          type: integer
          format: int32
          description: >-
            Gateway replicas sharing every limit until managed gateways have a
            live replica count (RL-24, RL-31); unset means 1.
        redis_budget:
          type: string
          description: One Redis time budget per request (RL-22), a Go duration greater than 0 and at most 1s; unset means 5ms.
    Plan:
      type: object
      additionalProperties: false
      required: [id, name, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, description: 'Unique; 1-64 characters from [A-Za-z0-9._-].' }
        default_limits:
          type: array
          items: { $ref: '#/components/schemas/PlanLimits' }
        quotas: { $ref: '#/components/schemas/Quotas' }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Quotas:
      type: object
      additionalProperties: false
      description: Cost units per UTC calendar day and month (RL-10); 0 or absent is no quota for that period. Managed mode only.
      properties:
        daily: { type: integer, format: int64, minimum: 0, maximum: 1000000000000000 }
        monthly: { type: integer, format: int64, minimum: 0, maximum: 1000000000000000 }
    PlanLimits:
      type: object
      additionalProperties: false
      properties:
        policy: { type: string, description: The policy's name. }
        limits:
          type: array
          items: { $ref: '#/components/schemas/Limit' }

    # Identity entities (CP-20).
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, plan_id, status, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, description: 'Unique; 1-64 characters from [A-Za-z0-9._-].' }
        plan_id: { type: integer, format: int64, description: A plan of the latest published config. }
        status: { type: string, enum: [active, suspended], default: active }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Consumer:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, status, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        tenant_id: { type: integer, format: int64 }
        name: { type: string, description: 'Unique within the tenant; 1-64 characters from [A-Za-z0-9._-].' }
        plan_id: { type: integer, format: int64, nullable: true, description: "A plan of the latest published config; null means the tenant's plan." }
        status: { type: string, enum: [active, suspended], default: active }
        jwt_subject: { type: string, nullable: true, description: 'The JWT sub that resolves to this consumer; unique.' }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    ApiKey:
      type: object
      description: An API key as listed; never the key or its hash.
      required: [id, consumer_id, prefix, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        consumer_id: { type: integer, format: int64 }
        prefix: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        rotated_from: { type: integer, format: int64, nullable: true }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Override:
      type: object
      additionalProperties: false
      required: [id, consumer_id, policy_id, limits, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        consumer_id: { type: integer, format: int64 }
        policy_id: { type: integer, format: int64, description: A policy of the latest published config. }
        limits:
          type: array
          items: { $ref: '#/components/schemas/Limit' }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true, description: Set for a burst grant (RL-08). }
        note: { type: string, nullable: true }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    QuotaOverride:
      type: object
      additionalProperties: false
      description: Replaces both of a consumer's plan quotas while it applies (RL-10); at most one standing (no ends_at) per consumer.
      required: [id, consumer_id, quotas, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        consumer_id: { type: integer, format: int64 }
        quotas: { $ref: '#/components/schemas/Quotas' }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true, description: Set for a burst grant. }
        note: { type: string, nullable: true }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    QuotaUsagePeriod:
      type: object
      required: [period, used, quota, flushed_at]
      properties:
        period: { type: string, description: 'd<YYYYMMDD> or m<YYYYMM>, UTC.' }
        used: { type: integer, format: int64, description: Cost units flushed; 0 without a flush. }
        quota: { type: integer, format: int64, description: The effective quota now; 0 for none. }
        flushed_at: { type: string, format: date-time, nullable: true, description: Null without a flush. }
    QuotaUsage:
      type: object
      required: [consumer_id, daily, monthly]
      properties:
        consumer_id: { type: integer, format: int64 }
        daily: { $ref: '#/components/schemas/QuotaUsagePeriod' }
        monthly: { $ref: '#/components/schemas/QuotaUsagePeriod' }
    AccessListEntry:
      type: object
      additionalProperties: false
      required: [id, action, subject_type, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        action: { type: string, enum: [allow, deny] }
        subject_type: { type: string, enum: [key, consumer, cidr] }
        api_key_id: { type: integer, format: int64, nullable: true, description: Set exactly when subject_type is key. }
        consumer_id: { type: integer, format: int64, nullable: true, description: Set exactly when subject_type is consumer. }
        cidr: { type: string, nullable: true, description: 'Set exactly when subject_type is cidr, such as 203.0.113.0/24.' }
        note: { type: string, nullable: true }
        version: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    # Publish, versions and rollback (CP-02 - CP-04, ADR-0037).
    ChangeNote:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000, description: 'What the change is for; stored with the version and in the audit log (UI-02).' }
    ConfigVersion:
      type: object
      additionalProperties: false
      required: [version, published_at, published_by, note, kind, rollback_of, working_set_revision, schema_version]
      properties:
        version: { type: integer, format: int64 }
        published_at: { type: string, format: date-time }
        published_by: { type: string, description: The publisher's token sub. }
        note: { type: string }
        kind: { type: string, enum: [publish, rollback] }
        rollback_of: { type: integer, format: int64, nullable: true, description: 'For a rollback, the version it copies.' }
        working_set_revision: { type: integer, format: int64, description: The working-set revision the version was published from. }
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        snapshot:
          type: object
          additionalProperties: true
          description: >-
            Only when one version is read: the published config, config.proto's
            Config message with proto field names (CP-21), its version and every
            entity's id included; 64-bit integers are JSON numbers.
        applied:
          type: array
          items: { $ref: '#/components/schemas/AppliedReplica' }
          description: >-
            Only when one version is read: the replicas that reported this
            version in a heartbeat, by name, each with its first report
            (ADR-0038, NFR-08). Reports are pruned after 7 days.
    AppliedReplica:
      type: object
      additionalProperties: false
      required: [replica, at]
      properties:
        replica: { type: string, description: The replica name. }
        at: { type: string, format: date-time, description: 'When the first heartbeat reporting the version arrived, on the clock of the control plane database.' }
    SchemaVersion:
      type: object
      additionalProperties: false
      required: [major, minor]
      description: The snapshot schema version (CP-18).
      properties:
        major: { type: integer, format: int32 }
        minor: { type: integer, format: int32 }
    ConfigVersionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigVersion' }
        next_cursor: { type: string, nullable: true }
    ConfigChange:
      type: object
      required: [entity, id, name, change]
      description: A config entity added, removed or changed; entities are matched by id, so a rename is a change.
      properties:
        entity: { type: string, enum: [upstream, route, policy, plan] }
        id: { type: integer, format: int64 }
        name: { type: string, description: The name after the change; before it for a removal. }
        change: { type: string, enum: [added, removed, changed] }
    ConfigValidation:
      type: object
      required: [working_set_revision, base_version, valid, errors, changes, diff]
      properties:
        working_set_revision: { type: integer, format: int64, description: What publish's If-Match carries. }
        base_version: { type: integer, format: int64, nullable: true, description: The latest published version; null before the first. }
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
        diff: { type: string, description: A unified diff of the canonical YAML from base_version to the working set; empty when nothing changed. }
    ConfigDiff:
      type: object
      required: [from_version, to_version, changes, diff]
      properties:
        from_version: { type: integer, format: int64 }
        to_version: { type: integer, format: int64 }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
        diff: { type: string, description: A unified diff of the canonical YAML of the two versions. }
    ConfigImport:
      type: object
      required: [working_set_revision, changes, ignored]
      properties:
        working_set_revision:
          type: integer
          format: int64
          description: The revision after the import, what validate and publish's If-Match carry; unchanged when the import changed nothing.
        changes:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
        ignored:
          type: array
          items: { type: string }
          description: Sections of the file that the control plane does not keep, each with its reason (ADR-0044); none since the config settings keep the ratelimit section (ADR-0045).

    # The audit log (CP-13, ADR-0040).
    AuditRecord:
      type: object
      required: [id, at, actor, action, entity, entity_id, diff, note, request_id, config_version, identity_version]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/AuditActor' }
        action: { type: string, description: '<entity>.<verb>, such as route.create, endpoint.drain or access_list.delete.' }
        entity: { type: string }
        entity_id: { type: string, nullable: true }
        diff:
          type: object
          additionalProperties: true
          description: >-
            {"before": …, "after": …} in the entity's REST representation;
            before is null on create, after on delete, and a delete that
            cascades adds removed, the IDs it removed by kind. Never a key,
            its hash, a token or a password.
        note: { type: string, nullable: true }
        request_id: { type: string, description: The change's X-Request-Id. }
        config_version: { type: integer, format: int64, nullable: true, description: The config version the change made. }
        identity_version: { type: integer, format: int64, nullable: true, description: The identity version the change made. }
    AuditActor:
      type: object
      required: [sub, name, roles]
      properties:
        sub: { type: string, description: The token's sub. }
        name: { type: string, description: The token's preferred_username. }
        roles:
          type: array
          items: { type: string }
    AuditList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        next_cursor: { type: string, nullable: true }

    # Gateway replicas (CP-08, ADR-0038).
    Replica:
      type: object
      additionalProperties: false
      required: [id, config_version, identity_version, schema_version, watch_connected, last_heartbeat_at, last_synced_at, live, rejected_config_version, rejected_reason]
      properties:
        id: { type: string, description: 'The replica name, such as gateway-1.' }
        config_version: { type: integer, format: int64, description: The config version the replica runs; 0 for none. }
        identity_version: { type: integer, format: int64, description: The identity version the replica runs; 0 for none. }
        schema_version: { $ref: '#/components/schemas/SchemaVersion' }
        watch_connected: { type: boolean, description: Whether its Watch stream was established at its last heartbeat. }
        last_heartbeat_at: { type: string, format: date-time }
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: 'Its last heartbeat sent while its Watch stream was established; staleness is now minus this (CP-08).'
        live: { type: boolean, description: 'Its last heartbeat is under 15 s old (RL-24).' }
        rejected_config_version: { type: integer, format: int64, nullable: true, description: The last config version it refused to apply; null when none since its last apply. }
        rejected_reason: { type: string, nullable: true, description: 'Why it refused, or why its on-disk snapshot could not be used.' }
    ReplicaList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Replica' }
        next_cursor: { type: string, nullable: true }

    # Heavy hitters (RL-21, ADR-0041).
    HeavyHitter:
      type: object
      additionalProperties: false
      required: [policy_id, key_digest, consumer_id, api_key_id, denied, shadow_denied]
      properties:
        policy_id: { type: integer, format: int64 }
        key_digest: { type: string, description: 'base64url of the first 16 bytes of HMAC-SHA256, under the heavy-hitter secret, of the 16-byte digest of the filled key template (ADR-0053); 22 characters. Not the digest in the Redis key.' }
        consumer_id: { type: integer, format: int64, nullable: true, description: The consumer of the latest throttled request that had one; null when none did. }
        api_key_id: { type: integer, format: int64, nullable: true, description: The API key of the latest throttled request that had one; null when none did. }
        denied: { type: integer, format: int64, description: Requests an enforce limit of the policy denied. }
        shadow_denied: { type: integer, format: int64, description: Requests the policy in shadow mode would have denied (RL-26). }
    HeavyHitterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HeavyHitter' }
    HeavyHitterLookup:
      type: object
      additionalProperties: false
      required: [policy_id, subject]
      properties:
        policy_id: { type: integer, format: int64, description: The policy whose key template the subject fills. }
        subject: { $ref: '#/components/schemas/HeavyHitterSubject' }
        since: { type: string, format: date-time, description: Windows that start at or after this time; by default 15 minutes ago. At most 7 days before until (or now). }
        until: { type: string, format: date-time, description: Windows that start before this time; by default none. Without since, since is 15 minutes before it. }
    HeavyHitterSubject:
      type: object
      additionalProperties: false
      description: >-
        The values the policy's key template takes, as a gateway fills
        them; only those its placeholders name are needed, the others are
        ignored. Never echoed in answers, logs or audit records.
      properties:
        ip: { type: string, description: '{ip}: the client IP; an IPv6 address stands for its /64, as on the gateway.' }
        consumer_id: { type: integer, format: int64, description: '{consumer}: the consumer ID.' }
        tenant_id: { type: integer, format: int64, description: '{tenant}: the tenant ID of the consumer.' }
        route: { type: string, description: '{route}: the route name.' }
        method: { type: string, description: '{method}: the HTTP method, upper-cased as on the gateway.' }
        headers:
          type: object
          additionalProperties: { type: string }
          description: '{header:<Name>}: the header value by name, the first value the request carried.'
    HeavyHitterLookupResult:
      type: object
      required: [key_digest, items]
      properties:
        key_digest: { type: string, description: The subject's keyed digest under the policy's template (ADR-0053). }
        items:
          type: array
          description: The windows, newest first; at most one per minute of the range.
          items: { $ref: '#/components/schemas/HeavyHitterWindow' }
    HeavyHitterWindow:
      type: object
      additionalProperties: false
      required: [window_start, policy_id, key_digest, consumer_id, api_key_id, denied, shadow_denied]
      properties:
        window_start: { type: string, format: date-time, description: The window's minute, UTC. }
        policy_id: { type: integer, format: int64 }
        key_digest: { type: string }
        consumer_id: { type: integer, format: int64, nullable: true, description: The consumer of the window's latest throttled request that had one; null when none did. }
        api_key_id: { type: integer, format: int64, nullable: true, description: The API key of the window's latest throttled request that had one; null when none did. }
        denied: { type: integer, format: int64 }
        shadow_denied: { type: integer, format: int64 }

    # The shadow report (UI-01, ADR-0060).
    ShadowReport:
      type: object
      additionalProperties: false
      required: [policy_id, policy_name, mode, config_version, window, since, until, evaluated, would_deny, share, enforce_evaluated, denied, enforce_share, metrics_since, metrics_error, keys, keys_shadow_denied_total, keys_since]
      properties:
        policy_id: { type: integer, format: int64 }
        policy_name: { type: string, description: "The policy's name in the latest published config version: the metric's policy label. Counts under an earlier name are not included." }
        mode: { type: string, description: 'Its mode in that version: enforce, shadow or off.' }
        config_version: { type: integer, format: int64, description: The latest published config version. }
        window: { type: string, enum: ['15m', '1h', '24h', '7d'] }
        since: { type: string, format: date-time, description: The window's start. }
        until: { type: string, format: date-time, description: The window's end, now. }
        evaluated: { type: number, format: double, nullable: true, description: 'Decisions the policy made in shadow mode (Prometheus increase(), an estimate); null without Prometheus.' }
        would_deny: { type: number, format: double, nullable: true, description: Of those, the requests it would have denied. }
        share: { type: number, format: double, nullable: true, description: 'would_deny / evaluated; null when nothing was evaluated.' }
        enforce_evaluated: { type: number, format: double, nullable: true, description: Decisions the policy made in enforce mode, as after a promotion. }
        denied: { type: number, format: double, nullable: true, description: Of those, the requests it denied. }
        enforce_share: { type: number, format: double, nullable: true, description: 'denied / enforce_evaluated; null when nothing was evaluated.' }
        metrics_since:
          type: string
          format: date-time
          nullable: true
          description: "Where Prometheus's data starts within the window: the later of since and its oldest sample (prometheus_tsdb_lowest_timestamp_seconds); null without Prometheus, or when Prometheus does not report its oldest sample."
        metrics_error:
          type: string
          nullable: true
          enum: [prometheus_not_configured, prometheus_unavailable, query_failed]
          description: Why the Prometheus fields are null; null when they are not.
        keys:
          type: array
          description: "The policy's top keys in the window, at most 50, most shadow would-denies first, then most denies. Heavy hitters are each replica's top 100 throttled keys per heartbeat (RL-21), so these are the heaviest keys, not all of them."
          items: { $ref: '#/components/schemas/ShadowReportKey' }
        keys_shadow_denied_total: { type: integer, format: int64, description: 'The shadow would-denies of every key in the windows, the 50 shown or not; below would_deny when keys outside the top lists would-denied.' }
        keys_since:
          type: string
          format: date-time
          nullable: true
          description: "Where the heavy-hitter windows start within the window: the later of since and the policy's oldest window kept (7 days, CP-22); null when it has none."
    ShadowReportKey:
      type: object
      additionalProperties: false
      required: [key_digest, consumer_id, api_key_id, shadow_denied, denied]
      properties:
        key_digest: { type: string, description: The keyed digest of the filled key template (ADR-0053), never the key. }
        consumer_id: { type: integer, format: int64, nullable: true }
        api_key_id: { type: integer, format: int64, nullable: true }
        shadow_denied: { type: integer, format: int64 }
        denied: { type: integer, format: int64 }

    # Pages (UI-06): next_cursor is null on the last page.
    UpstreamList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Upstream' }
        next_cursor: { type: string, nullable: true }
    RouteList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Route' }
        next_cursor: { type: string, nullable: true }
    PolicyList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
        next_cursor: { type: string, nullable: true }
    PlanList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Plan' }
        next_cursor: { type: string, nullable: true }
    TenantList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        next_cursor: { type: string, nullable: true }
    ConsumerList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Consumer' }
        next_cursor: { type: string, nullable: true }
    KeyIssue:
      type: object
      additionalProperties: false
      properties:
        expires_at: { type: string, format: date-time, nullable: true, description: 'When the key stops working, in the future; none: never. In demo mode at most 30 minutes ahead, and none means 30 minutes from now (SC-08, ADR-0095).' }
    KeyRotate:
      type: object
      additionalProperties: false
      properties:
        grace: { type: string, description: 'How long the old key keeps working: a Go duration from 0s to 168h; default 24h (D2). The old key never gets a later expiry than it has.' }
        note: { type: string, maxLength: 2000, description: Kept in the audit log. }
    KeyRevoke:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000, description: Kept in the audit log. }
    IssuedApiKey:
      type: object
      description: A new API key with the key itself, which no other answer shows (ADR-0039).
      required: [id, consumer_id, prefix, version, created_at, updated_at, key]
      properties:
        id: { type: integer, format: int64 }
        consumer_id: { type: integer, format: int64 }
        prefix: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        rotated_from: { type: integer, format: int64, nullable: true }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        key: { type: string, description: 'spw_<8-character prefix>_<43-character secret>; send it in X-API-Key.' }
    KeyRotation:
      type: object
      required: [old, new]
      properties:
        old: { $ref: '#/components/schemas/ApiKey' }
        new: { $ref: '#/components/schemas/IssuedApiKey' }
    ApiKeyList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
        next_cursor: { type: string, nullable: true }
    OverrideList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Override' }
        next_cursor: { type: string, nullable: true }
    QuotaOverrideList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotaOverride' }
        next_cursor: { type: string, nullable: true }
    QuotaUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotaUsage' }
    AccessListEntryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessListEntry' }
        next_cursor: { type: string, nullable: true }
    Me:
      type: object
      additionalProperties: false
      required: [subject, name, roles]
      properties:
        subject: { type: string, description: "The token's sub." }
        name: { type: string, description: "The token's preferred_username, or its sub when it has none." }
        roles:
          type: array
          description: "The caller's Spillway roles, in the order viewer, editor, publisher, key-admin, admin."
          items:
            type: string
            enum: [viewer, editor, publisher, key-admin, admin]

    # Demo mode (SC-08, ADR-0095).
    Demo:
      type: object
      additionalProperties: false
      required: [tenants, routes, scenarios]
      properties:
        tenants:
          type: array
          description: Every tenant (at most 500, by ID), with its plan.
          items: { $ref: '#/components/schemas/DemoTenant' }
        routes:
          type: array
          description: The Playground's routes (orders, catalog and payments) that the latest published config version has.
          items: { $ref: '#/components/schemas/DemoRoute' }
        scenarios:
          type: array
          description: The scenarios that the Playground runs (d1, d2 and d3).
          items: { type: string }
    DemoTenant:
      type: object
      additionalProperties: false
      required: [name, plan, limit]
      properties:
        name: { type: string }
        plan: { type: string, nullable: true, description: "The tenant's plan in the latest published config version; null for none." }
        limit:
          $ref: '#/components/schemas/DemoLimit'
    DemoRoute:
      type: object
      additionalProperties: false
      required: [name, policy, limit]
      properties:
        name: { type: string }
        policy: { type: string, nullable: true, description: 'The first consumer- or route-level policy that matches the route; null for none.' }
        limit:
          $ref: '#/components/schemas/DemoLimit'
    DemoLimit:
      type: object
      nullable: true
      additionalProperties: false
      description: >-
        A limit with its burst filled in. For a tenant, its plan's first limit
        for a policy that takes its limits from plans (from_plan); for a
        route, its policy's first limit, null when the policy takes its limits
        from plans (each tenant's plan then).
      required: [rate, burst, period]
      properties:
        rate: { type: integer, format: int64 }
        burst: { type: integer, format: int64 }
        period: { type: string }

    # The live-data stream's events (UI-03, ADR-0059).
    StreamQueryName:
      type: string
      description: A named query of the stream's catalogue (ADR-0059); openStream's sub parameter says what each answers.
      enum: [overview.requests, overview.ratelimited, overview.latency, overview.routes, overview.tenants, throttling.policies, throttling.heavy_hitters, replicas, routes.endpoints, routes.circuits]
    StreamReady:
      type: object
      additionalProperties: false
      required: [subscriptions, interval_s]
      properties:
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/StreamQueryName' }
        interval_s: { type: integer, format: int32, description: Seconds between evaluations of a subscription. }
    StreamResult:
      type: object
      additionalProperties: false
      required: [sub, at, data]
      properties:
        sub: { $ref: '#/components/schemas/StreamQueryName' }
        at: { type: string, format: date-time, description: "When the evaluation started, on the control plane's clock." }
        data:
          description: >-
            The query's data, by sub (StreamQueryName): a StreamMatrix, a
            StreamVector, a HeavyHitterList or StreamReplicas.
          anyOf:
            - $ref: '#/components/schemas/StreamMatrix'
            - $ref: '#/components/schemas/StreamVector'
            - $ref: '#/components/schemas/HeavyHitterList'
            - $ref: '#/components/schemas/StreamReplicas'
    StreamError:
      type: object
      additionalProperties: false
      required: [sub, at, code, message]
      properties:
        sub: { $ref: '#/components/schemas/StreamQueryName' }
        at: { type: string, format: date-time }
        code:
          type: string
          enum: [prometheus_unavailable, prometheus_not_configured, query_failed, unavailable]
          description: >-
            prometheus_unavailable: Prometheus refused, timed out or answered
            5xx; prometheus_not_configured: the control plane has no
            SPILLWAY_CP_PROMETHEUS_URL; query_failed: Prometheus refused the
            query or its answer; unavailable: Postgres is unavailable. The
            stream stays open and the next evaluation may succeed.
        message: { type: string, description: A message for people. }
    StreamEnd:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [token_expired, shutdown]
          description: "token_expired: the token's exp passed; reconnect with a fresh token. shutdown: the control plane is stopping."
    StreamMatrix:
      type: object
      additionalProperties: false
      required: [kind, step_s, series]
      properties:
        kind: { type: string, enum: [matrix] }
        step_s: { type: integer, format: int32, description: Seconds between points. }
        series:
          type: array
          items: { $ref: '#/components/schemas/StreamRangeSeries' }
    StreamRangeSeries:
      type: object
      additionalProperties: false
      required: [labels, points]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        points:
          type: array
          description: '[unix seconds, value] pairs; a value that is not a finite number (no data, NaN, ±Inf) is null.'
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, format: double, nullable: true }
    StreamVector:
      type: object
      additionalProperties: false
      required: [kind, series]
      properties:
        kind: { type: string, enum: [vector] }
        series:
          type: array
          items: { $ref: '#/components/schemas/StreamSample' }
    StreamSample:
      type: object
      additionalProperties: false
      required: [labels, value]
      properties:
        labels:
          type: object
          additionalProperties: { type: string }
        value: { type: number, format: double, nullable: true, description: Null when not a finite number. }
    StreamReplicas:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StreamReplica' }
    StreamReplica:
      type: object
      additionalProperties: false
      required: [replica, staleness_s]
      properties:
        replica: { $ref: '#/components/schemas/Replica' }
        staleness_s:
          type: number
          format: double
          nullable: true
          description: "Seconds since its last_synced_at, on Postgres's clock (CP-08); null when it never synced."
