              schema: { $ref: '#/components/schemas/ApiKeyList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: issueKey
      tags: [identity]
      summary: >-
        Issue an API key for the consumer (CP-15); applies at once with a new
        identity version (CP-20). The key is in this answer only: the control
        plane keeps its prefix and the SHA-256 of its secret (ADR-0039). In
        demo mode every key expires within 30 minutes of its issue (SC-08,
        ADR-0095)
      x-spillway-roles: [key-admin, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyIssue' }
      responses:
        '201':
          description: The key, shown once
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Error' }
  /keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: rotateKey
      tags: [identity]
      summary: >-
        Rotate an API key (CP-16): issue a new key for its consumer and keep
        the old one working for a grace period (default 24h, at most 168h),
        in one identity change (CP-20). The new key gets a copy of the old
        key's own access-list entries, allow and deny (RL-09). The new key is
        in this answer only. In demo mode the new key expires 30 minutes from
        now and the old one at the latest then (SC-08, ADR-0095)
      x-spillway-roles: [key-admin, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyRotate' }
      responses:
        '200':
          description: The old key, now expiring, and the new key, shown once
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The key is revoked or expired (conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Error' }
