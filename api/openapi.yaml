# Spillway control plane REST API (CP-10, ADR-0036). OpenAPI-first: this file
# is the source; `make api` generates internal/gen/apiv1 from it, `make
# lint-api` checks the generated code and runs oasdiff against origin/main,
# and the admin UI's client is generated from it (UI-05). A breaking change
# needs a new /api/v2 path, not an edit.
#
# Conventions (ADR-0036): JSON with snake_case fields; config entities carry
# their config.proto message's fields plus the REST-only version, created_at
# and updated_at; unknown fields are 400; bodies over 1 MiB are 413; GET of
# an entity answers ETag "<version>", and PUT, DELETE and drain require
# If-Match with it (428 when missing, 412 when stale); lists are cursor
# pages. Every operation needs a Keycloak access token (Authorization:
# Bearer, CP-11) and lists the roles allowed to call it in x-spillway-roles,
# which the server enforces before it reads the request: no or a bad token is
# 401, a token without a listed role 403 (CP-12, SEC-08, ADR-0040). Every
# successful mutation writes an audit record (CP-13).
openapi: 3.0.3
info:
  title: Spillway control plane
  version: 1.0.0
  description: >-
    Config entities (upstreams, routes, policies, plans) change the config
    working set until a publish; identity entities (tenants, consumers, keys,
    overrides, access lists) apply at once with a new identity version.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: config
    description: The config working set (CP-02)
  - name: identity
    description: Identity, applied at once (CP-20)
  - name: audit
    description: The audit log (CP-13)
paths:
  /upstreams:
    get:
      operationId: listUpstreams
      tags: [config]
      summary: List upstreams, by id ascending
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/NameFilter'
      responses:
        '200':
          description: A page of upstreams
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUpstream
      tags: [config]
      summary: Create an upstream in the config working set; it ships with the next publish (CP-02)
      x-spillway-roles: [editor, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Upstream' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upstream' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Error' }
  /upstreams/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUpstream
      tags: [config]
      summary: Read an upstream
      x-spillway-roles: [viewer, editor, publisher, key-admin, admin]
      responses:
        '200':
          description: The upstream
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upstream' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateUpstream
      tags: [config]
      summary: Replace an upstream in the config working set; it ships with the next publish (CP-02)
      x-spillway-roles: [editor, admin]
      parameters:
