// The config stream between gateways and the control plane (CP-06, CP-08,
// CP-18, ADR-0038). Same package as config.proto: one schema, one schema
// version. Changes are additive only (`buf breaking`); a change that is not
// is a new major version and a new package.
syntax = "proto3";

package spillway.config.v1;

option go_package = "github.com/ankitbisht23/spillway/internal/gen/configpb";

import "config.proto";
import "google/protobuf/timestamp.proto";

// ConfigService is served by the active control-plane replica only
// (CP-22, ADR-0038).
service ConfigService {
  // Watch sends the current config and identity, each when its version
  // differs from the request's, then every new version (CP-06).
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // Heartbeat records what the gateway runs and answers the live replica
  // count (CP-08, RL-24).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// SchemaVersion is the snapshot schema's version (CP-18): a gateway never
// applies another major; the control plane serves one minor behind.
message SchemaVersion {
  int32 major = 1;
  int32 minor = 2;
}

message WatchRequest {
  // The replica's name; with mTLS it must equal the client certificate's
  // (ADR-0040).
  string replica_id = 1;
  // The versions the gateway has; 0 = none.
  int64 config_version = 2;
  int64 identity_version = 3;
  // The schema the gateway was built with.
  SchemaVersion schema_version = 4;
}

// WatchResponse is a full config snapshot or a full identity snapshot.
message WatchResponse {
  oneof update {
    ConfigUpdate config = 1;
    IdentityUpdate identity = 2;
  }
}

message ConfigUpdate {
  SchemaVersion schema_version = 1;
  Config config = 2;
  google.protobuf.Timestamp published_at = 3;
}

message IdentityUpdate {
  SchemaVersion schema_version = 1;
  Identity identity = 2;
}

message HeartbeatRequest {
  string replica_id = 1;
  int64 config_version = 2;
  int64 identity_version = 3;
  SchemaVersion schema_version = 4;
  // Whether the gateway's Watch stream is established.
  bool watch_connected = 5;
  // The last config version the gateway refused to apply (0: none), and
  // why: its compile error, never a secret.
  int64 rejected_config_version = 6;
  string rejected_reason = 7;
  // Gateway clock, informational only.
  google.protobuf.Timestamp applied_at = 8;
  // The start of the top_keys interval (RL-21, ADR-0041).
  google.protobuf.Timestamp interval_start = 9;
  repeated TopKey top_keys = 10;
}

// TopKey is one heavy hitter of a heartbeat's interval (RL-21, ADR-0041).
message TopKey {
  int64 policy_id = 1;
  string key_digest = 2;
  int64 consumer_id = 3;
  int64 api_key_id = 4;
  int64 denied = 5;
  int64 shadow_denied = 6;
}

message HeartbeatResponse {
  // Replicas whose last heartbeat is under 15 s old, the caller included
  // (RL-24).
  int32 live_replicas = 1;
}

// SnapshotFile is a gateway's on-disk last good snapshot (CP-07, D9).
message SnapshotFile {
  SchemaVersion schema_version = 1;
  Config config = 2;
  Identity identity = 3;
  // When the file was written, after an apply.
  google.protobuf.Timestamp synced_at = 4;
  // The latest live replica count when it was written.
  int32 live_replicas = 5;
}
