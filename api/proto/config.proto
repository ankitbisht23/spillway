// Spillway's one config schema (CP-21, ADR-0005). YAML files, the admin API
// and Postgres snapshots all use its protojson form, with the proto's
// snake_case field names. Fields are added as milestones need them, and only
// in ways that `buf breaking` accepts.
syntax = "proto3";

package spillway.config.v1;

option go_package = "github.com/ankitbisht23/spillway/internal/gen/configpb";

import "google/protobuf/timestamp.proto";

// Config is the config section of a snapshot.
message Config {
  // Config version; each publish increases it (CP-02).
  int64 version = 1;
  repeated Upstream upstreams = 2;
  repeated Route routes = 3;
  RateLimitSettings ratelimit = 4;
  // Rate limiting policies, evaluated in this order (RL-03, ADR-0017).
  repeated Policy policies = 5;
  // Plans give consumers default limits per policy (RL-08, ADR-0041).
  repeated Plan plans = 6;
}

// Upstream is a cluster of endpoints that routes send traffic to (GW-06).
message Upstream {
  // Unique; routes refer to the upstream by name, and it is its stable ID
  // (GW-29).
  string name = 1;
  repeated Endpoint endpoints = 2;
  // Load balancing (GW-07, ADR-0030): "round_robin", "p2c" (least request
  // with the power of two choices) or "consistent_hash". Unset means p2c.
  string lb = 3;
  // consistent_hash only, and required with it: a key template, as a rate
  // limit policy's (ADR-0017), such as "{header:X-Cart-Id}". A request whose
  // template cannot be filled is balanced with p2c.
  string hash_on = 4;

  // Active health checks (GW-08); unset means none.
  HealthCheck health_check = 5;
  // Passive outlier ejection (GW-09); unset means the defaults (ADR-0030).
  OutlierDetection outlier_detection = 6;
  // Circuit breaker and concurrency caps (GW-14); unset means the defaults
  // (ADR-0030).
  CircuitBreaker circuit = 7;
  // Limits the upstream's retries (GW-13); unset means the defaults
  // (ADR-0030).
  RetryBudget retry_budget = 8;
  // Assigned by the control plane (ADR-0036); 0 in static mode.
  int64 id = 9;
}

// RetryBudget grants a retry while the retries granted over the last 10 s,
// this one included, are at most ratio times the first attempts over the
// same 10 s plus min_per_sec times 10 (GW-13, ADR-0030). Retries past it are
// dropped, never queued.
message RetryBudget {
  // More than 0 and at most 1. Unset means 0.2.
  double ratio = 1;
  // Retries per second granted on top of ratio: more than 0 and at most
  // 10000. Unset means 3.
  double min_per_sec = 2;
}

// HealthCheck probes each endpoint of an upstream on its own (GW-08,
// ADR-0030). A 2xx or 3xx answer is a success.
message HealthCheck {
  // Required: the path probed with GET, such as "/healthz"; may carry a
  // query.
  string path = 1;
  // Between the starts of two probes: a Go duration from 100ms to 1h. Unset
  // means 5s.
  string interval = 2;
  // One probe, connect to response headers: more than 0 and at most
  // interval. Unset means 1s, or interval when that is shorter.
  string timeout = 3;
  // Consecutive failed probes that make an endpoint unhealthy: 1 to 100.
  // Unset means 3.
  int32 unhealthy = 4;
  // Consecutive successful probes that make it healthy again: 1 to 100.
  // Unset means 2.
  int32 healthy = 5;
}

// OutlierDetection ejects an endpoint whose attempts keep failing (GW-09,
// ADR-0030).
message OutlierDetection {
  // Failed attempts in a row (5xx, connect error, reset or attempt timeout)
  // that eject an endpoint: 1 to 1000. Unset means 5.
  int32 consecutive_failures = 1;
  // An ejection lasts base_ejection times the number of times the endpoint
  // has been ejected: a Go duration from 1s to 1h. Unset means 30s.
  string base_ejection = 2;
  // The longest ejection: at least base_ejection, at most 24h. Unset means
  // 300s, or base_ejection when that is longer.
  string max_ejection = 3;
  // At most this share of an upstream's endpoints, rounded down, is ejected
  // at once: 1 to 100. Unset means 50.
  int32 max_ejected_percent = 4;
}

// CircuitBreaker protects an upstream (GW-14, ADR-0030): caps that answer
// 503 at once when full, and a state machine over its attempts' outcomes
// that opens when too many fail, answering 503 without sending anything, then
// lets a few probe requests through before closing again.
message CircuitBreaker {
  // Open connections to the upstream's endpoints: 1 to 1000000. Unset means
  // 1024.
  int32 max_connections = 1;
  // Attempts waiting for a connection: 1 to 1000000. Unset means 1024.
  int32 max_pending = 2;
  // Requests sent to the upstream and not finished, retries included: 1 to
  // 1000000. Unset means 1024.
  int32 max_concurrent = 3;
  // The share of failed attempts in the window that opens the breaker: more
  // than 0 and at most 1. Unset means 0.5.
  double error_rate = 4;
  // The rolling window of attempts: a Go duration from 1s to 10m. Unset
  // means 10s.
  string window = 5;
  // Attempts the window must hold before the breaker can open: 1 to
  // 1000000. Unset means 20.
  int32 min_requests = 6;
  // How long the breaker stays open before letting probes through: a Go
  // duration from 100ms to 10m. Unset means 10s.
  string open_for = 7;
  // Requests let through while half-open, each with one attempt; all
  // succeeding closes the breaker, any failing opens it again: 1 to 1000.
  // Unset means 5.
  int32 half_open_probes = 8;
}

// Endpoint is one address of an upstream.
message Endpoint {
  // host:port, unique within the upstream. DNS names are re-resolved on an
  // interval (GW-06).
  string address = 1;
  // Assigned by the control plane (ADR-0036); 0 in static mode.
  int64 id = 2;
  // A draining endpoint gets no new requests; requests already sent to it
  // finish (ADR-0005, ADR-0038). An upstream whose endpoints all drain
  // answers 503.
  bool draining = 3;
}

// Route matches requests and sends them to an upstream (GW-01).
message Route {
  // Unique.
  string name = 1;
  RouteMatch match = 2;
  // Name of the upstream that serves the route.
  string upstream = 3;
  // Breaks ties between otherwise equal routes; higher wins (ADR-0007).
  int32 priority = 4;
  // Removed from the front of the cleaned path before forwarding (GW-02);
  // whole segments of match.path or match.path_prefix, such as "/v1".
  string strip_prefix = 5;
  // Put in front of the path after strip_prefix is removed (GW-02).
  string add_prefix = 6;
  // Applied to the request sent upstream (GW-02).
  HeaderTransform request_headers = 7;
  // Applied to the upstream's response (GW-02).
  HeaderTransform response_headers = 8;
  // Larger request bodies get 413; 0 means no limit (GW-03).
  int64 max_body_bytes = 9;
  // Larger request headers get 431; 0 means the server's 64 KiB limit
  // (GW-03).
  int32 max_header_bytes = 10;
  Timeouts timeouts = 11;
  // Strict-Transport-Security max-age for the route's responses over TLS, as
  // a Go duration in whole seconds such as "8760h"; unset sends no header
  // (SEC-01).
  string hsts_max_age = 12;
  // Cost units each request deducts (RL-07); unset means 1.
  int64 cost = 13;
  // Retries (GW-12); unset means one attempt, no retry.
  Retry retry = 14;
  // Assigned by the control plane (ADR-0036); 0 in static mode.
  int64 id = 15;
  // none, api_key, jwt or either (GW-20, ADR-0039); unset means none.
  string auth_mode = 16;
}

// Retry sets how many attempts a route's requests get (GW-12, GW-13,
// ADR-0030). The conditions are the gateway's own: a connect error, a reset
// or the attempt's timeout before the response headers, or a 502, 503 or 504.
message Retry {
  // Attempts in all, the first included: 1 to 5. Unset means 1.
  int32 attempts = 1;
  // Retries every method, not only GET, HEAD, OPTIONS, PUT, DELETE and
  // TRACE (D4). Unset means false.
  bool non_idempotent = 2;
}

// HeaderTransform changes headers: remove first, then set, then add (GW-02).
// Framing, hop-by-hop, Host, Forwarded and X-Forwarded-* headers belong to
// the gateway and cannot be named (SEC-07).
message HeaderTransform {
  // Each replaces every value of its header.
  repeated HeaderValue set = 1;
  // Each adds a value, keeping the existing ones.
  repeated HeaderValue add = 2;
  // Header names to delete.
  repeated string remove = 3;
}

// HeaderValue is one header value.
message HeaderValue {
  string name = 1;
  string value = 2;
}

// Timeouts bound a route's upstream request (GW-11). Each is a Go duration
// such as "200ms" or "3s"; unset ones take their defaults (ADR-0011).
message Timeouts {
  // Opening one upstream connection.
  string connect = 1;
  // One upstream attempt.
  string per_try = 2;
  // The whole request, response body included; at most 59s.
  string total = 3;
  // No body bytes moving in either direction for this long aborts the
  // request.
  string idle = 4;
}

// RouteMatch is what a request must match; ADR-0007 gives the precedence.
message RouteMatch {
  // Exact host, case-insensitive, without a port; empty matches any host.
  string host = 1;
  // Empty matches any method.
  repeated string methods = 2;
  // Exactly one of path and path_prefix is set. A segment ":name" matches any
  // non-empty segment; a prefix matches whole segments.
  string path = 3;
  string path_prefix = 4;
  // All must match.
  repeated HeaderMatch headers = 5;
}

// HeaderMatch matches when any value of the header equals exact or fully
// matches regex (RE2).
message HeaderMatch {
  string name = 1;
  // Exactly one of exact and regex is set.
  string exact = 2;
  string regex = 3;
}

// RateLimitSettings apply to every policy.
message RateLimitSettings {
  // Gateway replicas sharing every limit; each runs limit / replicas, rounded
  // down, minimum 1 (RL-31). Unset means 1.
  int32 replicas = 1;
  // One Redis time budget per request (RL-22): a Go duration greater than 0
  // and at most 1s. Unset means 5ms.
  string redis_budget = 2;
}

// Policy is a rate limiting policy (RL-03, ADR-0017).
message Policy {
  // Unique; 1-64 characters from [A-Za-z0-9._-].
  string name = 1;
  // global, tenant, consumer or route.
  string level = 2;
  PolicyMatch match = 3;
  // Literal text with placeholders such as "{tenant}:{route}" (RL-04).
  string key_template = 4;
  // gcra, sliding_window, fixed_window or concurrency.
  string algorithm = 5;
  repeated Limit limits = 6;
  // enforce, shadow or off; unset means enforce (RL-26).
  string mode = 7;
  // Runs in gateway memory only and never touches Redis (RL-17); otherwise
  // the policy runs in Redis (ADR-0021).
  bool local = 8;
  // Redis policies only: fail_open, fail_closed or degraded; unset means
  // fail_open (RL-23).
  string failure_mode = 9;
  // Assigned by the control plane (ADR-0036); 0 in static mode.
  int64 id = 10;
  // Takes the limits from the consumer's plan instead of limits (RL-08,
  // ADR-0041).
  bool from_plan = 11;
}

// Plan sets default limits per policy for the consumers on it (RL-08,
// ADR-0041).
message Plan {
  // Assigned by the control plane (ADR-0036); 0 in static mode.
  int64 id = 1;
  // Unique; 1-64 characters from [A-Za-z0-9._-].
  string name = 2;
  repeated PlanLimits default_limits = 3;
}

// PlanLimits replaces one policy's limits for a plan's consumers.
message PlanLimits {
  // The policy's name.
  string policy = 1;
  repeated Limit limits = 2;
}

// PolicyMatch is the requests a policy applies to.
message PolicyMatch {
  // Route names, or the single entry "*" for every route.
  repeated string routes = 1;
  // Upper-case methods; empty means every method.
  repeated string methods = 2;
}

// Limit is one limit of a policy, as a cluster-wide number (RL-31).
message Limit {
  // Cost units per period; for concurrency, the max in flight.
  int64 rate = 1;
  // A Go duration in whole seconds, such as "1s" or "1h"; none for
  // concurrency.
  string period = 2;
  // GCRA only; defaults to rate for periods up to 1m and is required above
  // (RL-03).
  int64 burst = 3;
}

// Identity is the identity section of a snapshot (ADR-0005, GW-17). In
// static mode it comes from its own YAML file, with its own version; in
// managed mode the control plane builds it from its identity tables
// (CP-20, ADR-0037, ADR-0038).
message Identity {
  // Identity version; each change increases it.
  int64 version = 1;
  repeated Consumer consumers = 2;
  repeated ApiKey api_keys = 3;
  // "" for static keys (ADR-0017); "spw1" for managed keys (ADR-0039),
  // which the control plane sends.
  string key_format = 4;
  // Managed mode only, as are the fields below that carry IDs.
  repeated Tenant tenants = 5;
  repeated AccessListEntry access_lists = 6;
  repeated Override overrides = 7;
}

// Consumer is a client of the API.
message Consumer {
  // Unique.
  string name = 1;
  // Optional; empty leaves {tenant} unfilled. 1-64 characters from
  // [A-Za-z0-9._-] (ADR-0021). Static mode only.
  string tenant = 2;
  // Managed mode (ADR-0036): the consumer's ID, its tenant's, its plan's
  // (0: the tenant's plan), active or suspended, and the JWT subject that
  // resolves to it (ADR-0039).
  int64 id = 3;
  int64 tenant_id = 4;
  int64 plan_id = 5;
  string status = 6;
  string jwt_subject = 7;
}

// ApiKey is an API key, stored as its prefix and hash, never the key
// (GW-17, SEC-03).
message ApiKey {
  // Static keys: the key's first 12 bytes; managed keys: the 8-character
  // public prefix (ADR-0039). Unique.
  string prefix = 1;
  // Lower-case hex SHA-256: of the whole static key, of a managed key's
  // secret part.
  string hash = 2;
  // Static mode: the name of the consumer the key belongs to.
  string consumer = 3;
  // Managed mode: the key's ID, its consumer's ID, and when it stops
  // working (unset: never), on the gateway's clock (ADR-0039).
  int64 id = 4;
  int64 consumer_id = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// Tenant groups consumers and gives them a plan (managed mode, RL-08).
message Tenant {
  int64 id = 1;
  string name = 2;
  int64 plan_id = 3;
  // active or suspended.
  string status = 4;
}

// AccessListEntry allows or denies one key, consumer or CIDR (ADR-0041).
message AccessListEntry {
  int64 id = 1;
  // allow or deny.
  string action = 2;
  // key, consumer or cidr; exactly the matching field below is set.
  string subject_type = 3;
  int64 api_key_id = 4;
  int64 consumer_id = 5;
  string cidr = 6;
}

// Override replaces one policy's limits for one consumer, for a while
// (a burst grant) or until removed (ADR-0041).
message Override {
  int64 id = 1;
  int64 consumer_id = 2;
  int64 policy_id = 3;
  repeated Limit limits = 4;
  // Unset: from the start; unset ends_at: no end.
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
}
