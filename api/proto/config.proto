// Spillway's one config schema (CP-21, ADR-0005). YAML files, the admin API
// and Postgres snapshots all use its protojson form, with the proto's
// snake_case field names. Fields are added as milestones need them, and only
// in ways that `buf breaking` accepts.
syntax = "proto3";

package spillway.config.v1;

option go_package = "github.com/ankitbisht23/spillway/internal/gen/configpb";

// Config is the config section of a snapshot.
message Config {
  // Config version; each publish increases it (CP-02).
  int64 version = 1;
  repeated Upstream upstreams = 2;
  repeated Route routes = 3;
  RateLimitSettings ratelimit = 4;
  // Rate limiting policies, evaluated in this order (RL-03, ADR-0017).
  repeated Policy policies = 5;
}

// Upstream is a cluster of endpoints that routes send traffic to (GW-06).
message Upstream {
  // Unique; routes refer to the upstream by name, and it is its stable ID
  // (GW-29).
  string name = 1;
  repeated Endpoint endpoints = 2;
  // Load balancing (GW-07, ADR-0030): "round_robin", "p2c" (least request
  // with the power of two choices) or "consistent_hash". Unset means p2c.
  string lb = 3;
  // consistent_hash only, and required with it: a key template, as a rate
  // limit policy's (ADR-0017), such as "{header:X-Cart-Id}". A request whose
  // template cannot be filled is balanced with p2c.
  string hash_on = 4;

  // Active health checks (GW-08); unset means none.
  HealthCheck health_check = 5;
  // Passive outlier ejection (GW-09); unset means the defaults (ADR-0030).
  OutlierDetection outlier_detection = 6;
}

// HealthCheck probes each endpoint of an upstream on its own (GW-08,
// ADR-0030). A 2xx or 3xx answer is a success.
message HealthCheck {
  // Required: the path probed with GET, such as "/healthz"; may carry a
  // query.
  string path = 1;
  // Between the starts of two probes: a Go duration from 100ms to 1h. Unset
  // means 5s.
  string interval = 2;
  // One probe, connect to response headers: more than 0 and at most
  // interval. Unset means 1s, or interval when that is shorter.
  string timeout = 3;
  // Consecutive failed probes that make an endpoint unhealthy: 1 to 100.
  // Unset means 3.
  int32 unhealthy = 4;
  // Consecutive successful probes that make it healthy again: 1 to 100.
  // Unset means 2.
  int32 healthy = 5;
}

// OutlierDetection ejects an endpoint whose attempts keep failing (GW-09,
// ADR-0030).
message OutlierDetection {
  // Failed attempts in a row (5xx, connect error, reset or attempt timeout)
  // that eject an endpoint: 1 to 1000. Unset means 5.
  int32 consecutive_failures = 1;
  // An ejection lasts base_ejection times the number of times the endpoint
  // has been ejected: a Go duration from 1s to 1h. Unset means 30s.
  string base_ejection = 2;
  // The longest ejection: at least base_ejection, at most 24h. Unset means
  // 300s, or base_ejection when that is longer.
  string max_ejection = 3;
  // At most this share of an upstream's endpoints, rounded down, is ejected
  // at once: 1 to 100. Unset means 50.
  int32 max_ejected_percent = 4;
}

// Endpoint is one address of an upstream.
message Endpoint {
  // host:port, unique within the upstream. DNS names are re-resolved on an
  // interval (GW-06).
  string address = 1;
}

// Route matches requests and sends them to an upstream (GW-01).
message Route {
  // Unique.
  string name = 1;
  RouteMatch match = 2;
  // Name of the upstream that serves the route.
  string upstream = 3;
  // Breaks ties between otherwise equal routes; higher wins (ADR-0007).
  int32 priority = 4;
  // Removed from the front of the cleaned path before forwarding (GW-02);
  // whole segments of match.path or match.path_prefix, such as "/v1".
  string strip_prefix = 5;
  // Put in front of the path after strip_prefix is removed (GW-02).
  string add_prefix = 6;
  // Applied to the request sent upstream (GW-02).
  HeaderTransform request_headers = 7;
  // Applied to the upstream's response (GW-02).
  HeaderTransform response_headers = 8;
  // Larger request bodies get 413; 0 means no limit (GW-03).
  int64 max_body_bytes = 9;
  // Larger request headers get 431; 0 means the server's 64 KiB limit
  // (GW-03).
  int32 max_header_bytes = 10;
  Timeouts timeouts = 11;
  // Strict-Transport-Security max-age for the route's responses over TLS, as
  // a Go duration in whole seconds such as "8760h"; unset sends no header
  // (SEC-01).
  string hsts_max_age = 12;
  // Cost units each request deducts (RL-07); unset means 1.
  int64 cost = 13;
}

// HeaderTransform changes headers: remove first, then set, then add (GW-02).
// Framing, hop-by-hop, Host, Forwarded and X-Forwarded-* headers belong to
// the gateway and cannot be named (SEC-07).
message HeaderTransform {
  // Each replaces every value of its header.
  repeated HeaderValue set = 1;
  // Each adds a value, keeping the existing ones.
  repeated HeaderValue add = 2;
  // Header names to delete.
  repeated string remove = 3;
}

// HeaderValue is one header value.
message HeaderValue {
  string name = 1;
  string value = 2;
}

// Timeouts bound a route's upstream request (GW-11). Each is a Go duration
// such as "200ms" or "3s"; unset ones take their defaults (ADR-0011).
message Timeouts {
  // Opening one upstream connection.
  string connect = 1;
  // One upstream attempt.
  string per_try = 2;
  // The whole request, response body included; at most 59s.
  string total = 3;
  // No body bytes moving in either direction for this long aborts the
  // request.
  string idle = 4;
}

// RouteMatch is what a request must match; ADR-0007 gives the precedence.
message RouteMatch {
  // Exact host, case-insensitive, without a port; empty matches any host.
  string host = 1;
  // Empty matches any method.
  repeated string methods = 2;
  // Exactly one of path and path_prefix is set. A segment ":name" matches any
  // non-empty segment; a prefix matches whole segments.
  string path = 3;
  string path_prefix = 4;
  // All must match.
  repeated HeaderMatch headers = 5;
}

// HeaderMatch matches when any value of the header equals exact or fully
// matches regex (RE2).
message HeaderMatch {
  string name = 1;
  // Exactly one of exact and regex is set.
  string exact = 2;
  string regex = 3;
}

// RateLimitSettings apply to every policy.
message RateLimitSettings {
  // Gateway replicas sharing every limit; each runs limit / replicas, rounded
  // down, minimum 1 (RL-31). Unset means 1.
  int32 replicas = 1;
  // One Redis time budget per request (RL-22): a Go duration greater than 0
  // and at most 1s. Unset means 5ms.
  string redis_budget = 2;
}

// Policy is a rate limiting policy (RL-03, ADR-0017).
message Policy {
  // Unique; 1-64 characters from [A-Za-z0-9._-].
  string name = 1;
  // global, tenant, consumer or route.
  string level = 2;
  PolicyMatch match = 3;
  // Literal text with placeholders such as "{tenant}:{route}" (RL-04).
  string key_template = 4;
  // gcra, sliding_window, fixed_window or concurrency.
  string algorithm = 5;
  repeated Limit limits = 6;
  // enforce, shadow or off; unset means enforce (RL-26).
  string mode = 7;
  // Runs in gateway memory only and never touches Redis (RL-17); otherwise
  // the policy runs in Redis (ADR-0021).
  bool local = 8;
  // Redis policies only: fail_open, fail_closed or degraded; unset means
  // fail_open (RL-23).
  string failure_mode = 9;
}

// PolicyMatch is the requests a policy applies to.
message PolicyMatch {
  // Route names, or the single entry "*" for every route.
  repeated string routes = 1;
  // Upper-case methods; empty means every method.
  repeated string methods = 2;
}

// Limit is one limit of a policy, as a cluster-wide number (RL-31).
message Limit {
  // Cost units per period; for concurrency, the max in flight.
  int64 rate = 1;
  // A Go duration in whole seconds, such as "1s" or "1h"; none for
  // concurrency.
  string period = 2;
  // GCRA only; defaults to rate for periods up to 1m and is required above
  // (RL-03).
  int64 burst = 3;
}

// Identity is the identity section of a snapshot (ADR-0005, GW-17). Before
// M5 it comes from its own YAML file, with its own version.
message Identity {
  // Identity version; each change increases it.
  int64 version = 1;
  repeated Consumer consumers = 2;
  repeated ApiKey api_keys = 3;
}

// Consumer is a client of the API.
message Consumer {
  // Unique.
  string name = 1;
  // Optional; empty leaves {tenant} unfilled. 1-64 characters from
  // [A-Za-z0-9._-] (ADR-0021).
  string tenant = 2;
}

// ApiKey is a static API key, stored as its prefix and hash, never the key
// (GW-17, SEC-03).
message ApiKey {
  // The key's first 12 bytes; unique.
  string prefix = 1;
  // Lower-case hex SHA-256 of the whole key.
  string hash = 2;
  // Name of the consumer the key belongs to.
  string consumer = 3;
}
