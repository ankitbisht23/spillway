{{- /*
GW-25 (ADR-0075 §D11): the admin ports admit only Prometheus and the
kubelet (the node network). The gateway's traffic port is open; the control
plane's gRPC admits the gateways and its REST the pods of this namespace
other than the gateways (SEC-02, ADR-0091): a published route to it would
otherwise put the admin API and UI on the public edge.
Egress is not restricted in v1.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spillway-gateway
  labels:
    {{- include "spillway.labels" . | nindent 4 }}
    app.kubernetes.io/name: spillway-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spillway-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8443 }
    - from:
        {{- include "spillway.prometheusPeer" . | trim | nindent 8 }}
        {{- include "spillway.kubeletPeers" . | trim | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spillway-controlplane
  labels:
    {{- include "spillway.labels" . | nindent 4 }}
    app.kubernetes.io/name: spillway-controlplane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spillway-controlplane
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spillway-gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 9090 }
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: NotIn, values: [spillway-gateway] }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        {{- include "spillway.prometheusPeer" . | trim | nindent 8 }}
        {{- include "spillway.kubeletPeers" . | trim | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8081 }
