{{- /*
One service account each for the gateway and the control plane, with no
token mounted and no Role: neither calls the Kubernetes API (ADR-0075 §D11).
The migrate Job's is a hook (migrate-job.yaml), created before it.
*/}}
{{- range $name := list "spillway-gateway" "spillway-controlplane" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "spillway.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
automountServiceAccountToken: false
{{- end }}
