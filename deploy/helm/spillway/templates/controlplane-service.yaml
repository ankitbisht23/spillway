{{- /*
REST + admin UI and the config stream, inside the cluster only (SEC-02);
the admin port is in no Service. A person reaches the UI with
kubectl port-forward.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: spillway-controlplane
  labels:
    {{- include "spillway.labels" . | nindent 4 }}
    app.kubernetes.io/name: spillway-controlplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spillway-controlplane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, protocol: TCP, port: 8080, targetPort: http }
    - { name: grpc, protocol: TCP, port: 9090, targetPort: grpc }
