# The demo stack (SC-01, ADR-0094 §2): everything demo-only, used only by
# the demo targets as a second file after compose.yaml, with --profile
# replicas --profile demo (deploy/demo/demo.sh). compose.yaml does not
# change. Every container this file creates or overrides carries the label
# spillway.demo=true, and make dev removes such containers before it starts
# the dev stack, so no dev, verify or bench run meets a demo container.
#
# The demo runs on its own database, spillway_demo, in compose's Postgres
# (ADR-0094 §1); gateway-1 … gateway-3 run in managed mode and reach Redis
# through toxiproxy's demo-redis-N proxies (ADR-0094 §4, §5).

x-env-local: &env-local
  - path: .env.local
    required: false

x-demo-traffic: &demo-traffic
  build: { context: ., target: demo-traffic }
  image: spillway-demo-traffic:dev
  profiles: [demo]
  env_file: *env-local
  read_only: true

x-demo-gateway: &demo-gateway
  labels: { spillway.demo: "true" }
  # Managed mode (ADR-0038): both files set empty, the control plane set.
  # The address map sends each Redis node, as the seeds name it and as
  # every slot map, MOVED and ASK names it, through its demo proxy, where
  # D5 cuts it (ADR-0094 §5).
  environment:
    SPILLWAY_GATEWAY_CONFIG: ""
    SPILLWAY_GATEWAY_IDENTITY: ""
    SPILLWAY_GATEWAY_CONTROL_PLANE: controlplane:9090
    SPILLWAY_REDIS_ADDR_MAP: redis-0:6379=toxiproxy:26380,redis-1:6379=toxiproxy:26381,redis-2:6379=toxiproxy:26382,redis-3:6379=toxiproxy:26383,redis-4:6379=toxiproxy:26384,redis-5:6379=toxiproxy:26385
  depends_on:
    demo-init: { condition: service_completed_successfully }
    demo-seed: { condition: service_completed_successfully }

services:
  # One-shot: creates the database spillway_demo, owned by spillway, if it
  # does not exist (ADR-0094 §1).
  demo-db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    profiles: [demo]
    labels: { spillway.demo: "true", spillway.oneshot: "true" }
    env_file: *env-local
    read_only: true
    environment:
      PGHOST: postgres
      PGUSER: spillway
      PGDATABASE: spillway
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-secret}
    entrypoint: ["sh", "-c"]
    command:
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'spillway_demo'" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE spillway_demo OWNER spillway'
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: compose's migrate, on spillway_demo.
  demo-migrate:
    build: { context: ., target: controlplane }
    image: spillway-controlplane:dev
    profiles: [demo]
    labels: { spillway.demo: "true", spillway.oneshot: "true" }
    env_file: *env-local
    read_only: true
    command: ["migrate"]
    environment:
      SPILLWAY_CP_MIGRATE_DATABASE_URL: postgres://spillway@postgres:5432/spillway_demo?sslmode=disable # the owner role
      SPILLWAY_CP_MIGRATE_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-secret}
      SPILLWAY_CP_DATABASE_PASSWORD: ${SPILLWAY_CP_DATABASE_PASSWORD:-dev-only-not-secret} # the app role's, as compose's migrate sets it
    depends_on:
      demo-db: { condition: service_completed_successfully }

  # One-shot: the demo's toxiproxy proxies, demo-redis-0 … 5 on 26380-26385
  # and demo-upstream-1 … 3 on 26391-26393, inside the network only
  # (ADR-0094 §5, docs/ports.md). make demo-down deletes them.
  demo-init:
    <<: *demo-traffic
    labels: { spillway.demo: "true", spillway.oneshot: "true" }
    command: ["proxies"]
    environment:
      SPILLWAY_DEMO_TOXIPROXY_URL: http://toxiproxy:8474
    depends_on:
      toxiproxy: { condition: service_healthy }

  # One-shot: imports and publishes deploy/demo/config.yaml and creates the
  # tenants and consumers of deploy/demo/seed.yaml through the REST API with
  # a spillway-ci service token (ADR-0094 §3); idempotent; no API key.
  demo-seed:
    <<: *demo-traffic
    labels: { spillway.demo: "true", spillway.oneshot: "true" }
    command: ["seed"]
    environment:
      SPILLWAY_DEMO_CP_URL: http://controlplane:8080
      SPILLWAY_DEMO_TOKEN_URL: http://keycloak:8080/auth/realms/spillway/protocol/openid-connect/token
      SPILLWAY_DEMO_CLIENT_ID: spillway-ci
      SPILLWAY_DEMO_CLIENT_SECRET: ${SPILLWAY_CI_CLIENT_SECRET:-dev-only-not-secret} # never printed (SEC-09)
    volumes: ["./deploy/demo:/etc/spillway-demo:ro"]
    depends_on:
      controlplane: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # The control plane on spillway_demo. No Redis seeds, so the quota
  # flusher is off (an override cannot unset a variable; empty means none):
  # the demo has no quotas, and the demo control plane never writes quota
  # state for tenant IDs the dev database also uses (D29). Demo mode
  # (SC-08, ADR-0095 §1) comes from DEMO_MODE, which make demo sets true;
  # only this file maps it, so make dev's control plane never has it. The
  # fault switches (SC-03, ADR-0095 §5) speak only HTTP to toxiproxy's API;
  # the Playground (UI-07, ADR-0096 §3) sends its runs round robin to the
  # three demo gateways inside the network.
  controlplane:
    labels: { spillway.demo: "true" }
    environment:
      SPILLWAY_CP_DATABASE_URL: postgres://spillway_app@postgres:5432/spillway_demo?sslmode=disable
      SPILLWAY_CP_REDIS_ADDRS: ""
      SPILLWAY_CP_DEMO_MODE: ${DEMO_MODE:-false}
      SPILLWAY_CP_DEMO_TOXIPROXY_URL: http://toxiproxy:8474
      SPILLWAY_CP_DEMO_GATEWAYS: http://gateway-1:8000,http://gateway-2:8000,http://gateway-3:8000
    depends_on:
      demo-migrate: { condition: service_completed_successfully }

  # The base load (SC-02, ADR-0096 §1, §2): demo-traffic run
  # --scenario=base sends each tenant's base load round robin over the
  # three demo gateways while the demo runs, with keys it issues at start
  # and replaces before they expire (never printed). make demo-d1 … d7
  # stop it, run the scenario (base load plus its bursts) in a one-off
  # container of this service and start it again (deploy/demo/scenario.sh),
  # so exactly one base load runs at any time. Its health listener is
  # loopback inside the container (8090, docs/ports.md).
  demo-traffic:
    <<: *demo-traffic
    labels: { spillway.demo: "true" }
    command: ["run", "--scenario=base"]
    environment:
      SPILLWAY_DEMO_CP_URL: http://controlplane:8080
      SPILLWAY_DEMO_TOKEN_URL: http://keycloak:8080/auth/realms/spillway/protocol/openid-connect/token
      SPILLWAY_DEMO_CLIENT_ID: spillway-ci
      SPILLWAY_DEMO_CLIENT_SECRET: ${SPILLWAY_CI_CLIENT_SECRET:-dev-only-not-secret} # never printed (SEC-09)
      SPILLWAY_DEMO_GATEWAYS: http://gateway-1:8000,http://gateway-2:8000,http://gateway-3:8000
      SPILLWAY_DEMO_ADMIN_URLS: http://gateway-1:8001,http://gateway-2:8001,http://gateway-3:8001
    ulimits:
      nofile: 65536
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/demo-traffic", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      controlplane: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      gateway-1: { condition: service_healthy }
      gateway-2: { condition: service_healthy }
      gateway-3: { condition: service_healthy }

  # The demo Grafana (SC-05, ADR-0096 §4): compose's Grafana image with
  # anonymous viewers (Viewer only), no login form, no basic auth, no
  # sign-up, no Explore, no external snapshots and no embedding; only the
  # Prometheus datasource and only the Demo dashboard, which is also the
  # home page. No host port: Caddy serves it at /grafana (ADR-0097 §1), so
  # it serves from that sub-path, and its root URL follows DEMO_PUBLIC_URL
  # (make demo-share sets it; default the local proxy). Its database is on
  # a tmpfs, so nothing a visitor does outlives the container. The admin
  # password is unusable (no login form, no basic auth) and dev-only. No
  # env_file: nothing from .env.local reaches it (ADR-0104). The dev Grafana
  # on 3000 does not change.
  grafana-demo:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [demo]
    labels: { spillway.demo: "true" }
    read_only: true
    tmpfs: ["/var/lib/grafana:uid=472,gid=0", "/tmp:uid=472,gid=0"]
    environment:
      GF_SERVER_ROOT_URL: ${DEMO_PUBLIC_URL:-http://localhost:8888}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-demo/demo.json
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_DEMO_ADMIN_PASSWORD:-dev-only-not-secret}
    volumes:
      - ./deploy/grafana/demo/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/demo/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/demo/demo.json:/var/lib/grafana-demo/demo.json:ro
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The demo proxy (SC-09, ADR-0097 §1), local only until make demo-share:
  # the UI and /api at /, Keycloak's public endpoints at /auth (its admin
  # console and admin API answer 404), the demo Grafana at /grafana, on
  # 127.0.0.1:8888 (docs/ports.md). It never fronts a gateway, an admin
  # port, the gRPC stream, Prometheus or the dev Grafana. Fixed address
  # 172.29.255.10, the one the control plane and Keycloak will trust for
  # forwarded client addresses (ADR-0097 §2); Caddy writes no access log
  # and, like grafana-demo, gets nothing from .env.local (ADR-0104).
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [demo]
    labels: { spillway.demo: "true" }
    ports: ["127.0.0.1:8888:8888"]
    read_only: true
    tmpfs: ["/data:uid=1000,gid=1000", "/config:uid=1000,gid=1000"]
    cap_drop: [ALL]
    user: "1000:1000"
    volumes: ["./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks:
      default:
        ipv4_address: 172.29.255.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/api/ui-config"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      controlplane: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      grafana-demo: { condition: service_healthy }

  # The demo gateways: always these three (ADR-0094 §4); gateway-4 and
  # gateway-5 stay down.
  gateway-1:
    <<: *demo-gateway
  gateway-2:
    <<: *demo-gateway
  gateway-3:
    <<: *demo-gateway
