# Redis Cluster node for dev and tests (ADR-0004). Each node adds
# --cluster-announce-hostname redis-N on its command line.
port 6379
bind * -::*
protected-mode no

cluster-enabled yes
# /data is a tmpfs, so every `up` after a `down` starts a fresh cluster.
cluster-config-file /data/nodes.conf
cluster-node-timeout 3000
cluster-preferred-endpoint-type hostname
# A failed primary costs only its own slots: the other primaries keep
# answering while its replica takes over (ADR-0021, make chaos-redis-primary).
cluster-require-full-coverage no

# No persistence: limiter state is ephemeral by design.
appendonly no
save ""

# A full node fails writes instead of evicting limiter state.
maxmemory 256mb
maxmemory-policy noeviction
