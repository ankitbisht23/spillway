# Prometheus scrapes admin ports (Observability), the control plane's included
# (ADR-0040).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway-1:8001"]
  - job_name: controlplane
    static_configs:
      - targets: ["controlplane:8081"]
