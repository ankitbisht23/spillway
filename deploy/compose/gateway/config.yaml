# Config for the compose gateways (CP-05): every path goes to the three mock
# upstreams, e.g. http://127.0.0.1:8000/bytes/1024. The directory is mounted,
# so saving this file (even by rename) reloads the gateways within a second.
version: 1
# Only gateway-1 runs by default; with --profile replicas, five gateways share
# every limit, so set this to 5 (RL-31).
ratelimit: { replicas: 1 }
upstreams:
  - name: httpbin
    endpoints:
      - address: upstream-1:8080
      - address: upstream-2:8080
      - address: upstream-3:8080
routes:
  - name: delay
    match: { path_prefix: /delay }
    upstream: httpbin
  # A small limit to see a 429 by hand, e.g. GET /anything/limited six times.
  - name: limited
    match: { path_prefix: /anything/limited }
    upstream: httpbin
  # Redis policies (ADR-0021), keyed by X-Shared-Key so that each value has
  # its own limits: see the policies below.
  - name: shared
    match: { path_prefix: /anything/shared }
    upstream: httpbin
  # Up to 3 attempts per request (GW-12), each a span in Tempo (OB-02):
  # GET /retry/status/503 makes three.
  - name: retry
    match: { path_prefix: /retry }
    strip_prefix: /retry
    upstream: httpbin
    retry: { attempts: 3 }
  - name: default
    match: { path_prefix: / }
    upstream: httpbin
# Local policies (ADR-0017): each gateway keeps their state in memory, and
# none touches Redis (RL-17). The limits stay well above what make verify-m1
# and the benchmarks send. The last two policies run in Redis and apply only
# to /anything/shared.
policies:
  - name: per-ip # IP flood limit; covers anonymous traffic too
    level: global
    match: { routes: ['*'] }
    key_template: '{ip}'
    algorithm: gcra
    limits: [{ rate: 5000, period: 1s }]
    local: true
  - name: per-key # records what a per-key limit would deny, never rejects
    level: consumer
    match: { routes: ['*'] }
    key_template: '{api_key}'
    algorithm: gcra
    limits: [{ rate: 10, period: 1s }]
    mode: shadow
    local: true
  - name: delay-inflight
    level: route
    match: { routes: [delay] }
    key_template: '{route}'
    algorithm: concurrency
    limits: [{ rate: 20 }] # max in flight; always local
  - name: limited-per-ip
    level: global
    match: { routes: [limited] }
    key_template: '{ip}'
    algorithm: fixed_window
    limits: [{ rate: 5, period: 10s }]
    local: true
  # Redis policies (ADR-0021), shared by every gateway. With an API key whose
  # consumer has a tenant (alice's), shared-tenant runs in the tenant-slot
  # call; shared-global is called after it, and when it denies (the 4th
  # request within 10 s for one X-Shared-Key), the tenant-slot deduction is
  # refunded (RL-14). Without X-Shared-Key neither applies.
  - name: shared-tenant
    level: tenant
    match: { routes: [shared] }
    key_template: '{tenant}:{header:X-Shared-Key}'
    algorithm: sliding_window
    limits: [{ rate: 100, period: 1h }]
  - name: shared-global
    level: global
    match: { routes: [shared] }
    key_template: '{header:X-Shared-Key}'
    algorithm: gcra
    limits: [{ rate: 3, period: 10s }]
