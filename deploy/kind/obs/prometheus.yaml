# Prometheus on kind (ADR-0075 §D10): compose's image with exemplar storage
# (OB-06), its config from deploy/kind/config/prometheus.yml (the ConfigMap
# prometheus-config) and alert rules from the optional ConfigMap
# prometheus-rules (OB-05). Its service account may list pods in the
# spillway namespace only, for service discovery; it is the one workload
# here that calls the Kubernetes API. Storage is an emptyDir: history goes
# with the pod. The chart's NetworkPolicies admit it by its label
# app.kubernetes.io/name: prometheus (GW-25).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: spillway-obs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: spillway
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: spillway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: spillway-obs
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --enable-feature=exemplar-storage
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { port: http, path: /-/ready }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { port: http, path: /-/healthy }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules, optional: true }
        - name: data
          emptyDir: {}
