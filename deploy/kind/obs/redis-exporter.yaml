# redis_exporter on kind (ADR-0075 §D10): the newest release at least two
# weeks old on 2026-11-25 (v1.97.0, 2026-11-04), new with M7. Prometheus's
# redis job scrapes each Redis node through /scrape?target=…; the nodes'
# password comes from the Secret dev-secrets and applies to every target,
# so the NetworkPolicy at the end lets the exporter reach only the Redis
# pods (and DNS), and only Prometheus and the kubelet reach it (ADR-0091).
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: redis-exporter }
spec:
  selector: { app.kubernetes.io/name: redis-exporter }
  ports:
    - { name: metrics, port: 9121, targetPort: 9121 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: redis-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis-exporter }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
          env:
            # Its own /metrics asks one node; the redis job uses /scrape.
            - { name: REDIS_ADDR, value: "redis://redis-0.redis.spillway-deps.svc.cluster.local:6379" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: dev-secrets, key: REDIS_PASSWORD } }
          ports:
            - { name: metrics, containerPort: 9121 }
          readinessProbe:
            httpGet: { port: metrics, path: /health }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# Egress: the Redis nodes' 6379 and cluster DNS only, so no /scrape target
# elsewhere ever gets the password. Ingress: Prometheus, and addresses
# outside the pod network (the kubelet's probe comes from the node network,
# which kind-up learns only later); every other pod is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-exporter
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: redis-exporter }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis-exporter }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.244.0.0/16] } # kind's pod network (cluster.yaml)
      ports:
        - { protocol: TCP, port: 9121 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: spillway-deps }
          podSelector:
            matchLabels: { app.kubernetes.io/name: redis }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
