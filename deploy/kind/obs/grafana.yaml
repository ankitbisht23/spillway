# Grafana on kind (ADR-0075 §D10): compose's image and datasources (the
# ConfigMap grafana-datasources, from
# deploy/compose/grafana/provisioning/datasources/datasources.yaml; the
# Services prometheus, tempo and loki have the same names in this
# namespace), the admin password from the Secret dev-secrets, and dashboards
# from the optional ConfigMap grafana-dashboards (OB-04) through the
# provider below. make kind-grafana forwards 127.0.0.1:13000 to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: spillway-obs
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: spillway
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: grafana }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: spillway-obs
  labels: { app.kubernetes.io/name: grafana }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: dev-secrets, key: GRAFANA_ADMIN_PASSWORD } }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            httpGet: { port: http, path: /api/health }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { port: http, path: /api/health }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { port: http, path: /api/health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # 512 Mi, not the 256 of ADR-0075's plan: Grafana 13's first start
          # (its storage migrations) is OOM-killed at 256 Mi (ADR-0085).
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana-dashboards, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards, optional: true }
