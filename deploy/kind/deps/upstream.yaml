# The demo upstream on kind (ADR-0075 §D10): compose's go-httpbin image
# (compose adds only a busybox layer for its healthcheck, which HTTP probes
# make unnecessary here), two replicas behind the Service upstream:8080, in
# the pod and Service ranges the upstream allow-list admits (SEC-06).
apiVersion: v1
kind: Service
metadata:
  name: upstream
  namespace: spillway-deps
  labels: { app.kubernetes.io/name: upstream }
spec:
  selector: { app.kubernetes.io/name: upstream }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream
  namespace: spillway-deps
  labels: { app.kubernetes.io/name: upstream }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: upstream }
  template:
    metadata:
      labels: { app.kubernetes.io/name: upstream }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: upstream
          image: mccutchen/go-httpbin:2.26.0
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { port: http, path: /status/200 }
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { port: http, path: /status/200 }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
