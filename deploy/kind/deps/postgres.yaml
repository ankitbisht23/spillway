# Postgres on kind (ADR-0075 §D10): compose's image, user and database, the
# owner role's password from the Secret dev-secrets, one replica with a 1 Gi
# volume on kind's default storage class (standard). The chart's migrate Job
# creates the app role (CP-19, ADR-0040).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spillway-deps
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: spillway-deps
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - { name: POSTGRES_USER, value: spillway }
            - { name: POSTGRES_DB, value: spillway }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dev-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "spillway", "-d", "spillway"]
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests: { storage: 1Gi }
