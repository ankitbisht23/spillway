# Keycloak on kind (ADR-0075 §D10, SEC-04): compose's image in production
# mode, HTTPS only on 8443 with the certificate make certs mints
# (deploy/certs/kind-keycloak.pem, the Secret keycloak-tls), and compose's
# realm (the ConfigMap keycloak-realm, from deploy/compose/keycloak/realm.json).
# Its one hostname is the in-cluster https name, so the issuer the gateway and
# the control plane check, and the JWKS URL they fetch, are
#   https://keycloak.spillway-deps.svc.cluster.local:8443/auth/realms/spillway
# and they run without dev_mode. The realm lives in Keycloak's file database
# (dev-file), re-imported on every start: there is no state to keep.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: spillway-deps
  labels: { app.kubernetes.io/name: keycloak }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: https, port: 8443, targetPort: 8443 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: spillway-deps
  labels: { app.kubernetes.io/name: keycloak }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start", "--import-realm"]
          env:
            - { name: KC_HOSTNAME, value: "https://keycloak.spillway-deps.svc.cluster.local:8443/auth" }
            - { name: KC_HTTP_RELATIVE_PATH, value: /auth }
            - { name: KC_HTTP_ENABLED, value: "false" }
            - { name: KC_HTTPS_PORT, value: "8443" }
            - { name: KC_HTTPS_CERTIFICATE_FILE, value: /etc/keycloak-tls/tls.crt }
            - { name: KC_HTTPS_CERTIFICATE_KEY_FILE, value: /etc/keycloak-tls/tls.key }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_DB, value: dev-file }
            - { name: JAVA_OPTS_KC_HEAP, value: "-Xms256m -Xmx512m" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: dev-secrets, key: KEYCLOAK_ADMIN_PASSWORD } }
          ports:
            - { name: https, containerPort: 8443 }
            - { name: management, containerPort: 9000 }
          # The management port serves health over HTTPS too (it follows the
          # main interface's TLS); the kubelet does not verify the certificate.
          startupProbe:
            httpGet: { scheme: HTTPS, port: management, path: /auth/health/started }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { scheme: HTTPS, port: management, path: /auth/health/ready }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { scheme: HTTPS, port: management, path: /auth/health/live }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /etc/keycloak-tls, readOnly: true }
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: keycloak-tls, defaultMode: 0444 }
        - name: realm
          configMap: { name: keycloak-realm }
