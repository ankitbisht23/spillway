# NFR-01 throughput benchmark and the NFR-05 regression gate (docs/design.md,
# Benchmark method; ADR-0003, ADR-0015, ADR-0016, ADR-0073 §D8, ADR-0081).
# Nightly at 03:17 UTC on main with the gate, or by manual trigger with the
# gate off by default. Each architecture runs test/load/bench.sh on its own
# 4-vCPU runner at its own target rate; cmd/benchgate then judges the run set
# against its nightly and last-release baselines on a fetched copy of
# bench-results (same arch, recorded CPU model, target rate and setup only)
# and writes the verdict to the job summary. A flagged run set re-runs once
# in the same job; a re-run flagged again fails both. Every run set's JSON,
# with its gate field, is pushed to the bench-results branch as
# results/<arch>/<UTC-timestamp>.json, valid or not; an invalid run set or a
# confirmed regression then fails its job. A dispatch with mode scaling runs
# test/load/scaling.sh instead (NFR-02, ADR-0074 §D9): never gated, stored
# with setup.mode "scaling", and its job fails unless the result is valid and
# passes. Actions are pinned to commit SHAs.
name: bench
# Names the mode, rates and gate, so a script can find its run (ADR-0074).
run-name: >-
  EXPLORATORY diagnostics, not a result: bench ${{ inputs.mode || 'throughput' }}
  x64=${{ inputs.rate_x64 || 4600 }} arm64=${{ inputs.rate_arm64 || 8800 }}
  gate=${{ (github.event_name == 'schedule' || inputs.gate) && inputs.mode != 'scaling' }}

on:
  schedule:
    - cron: '17 3 * * *' # off the hour, when GitHub's queues are shorter
  workflow_dispatch:
    # About 90% of the slowest run in the first, saturated run set on each
    # runner, so the gateway runs below capacity (ADR-0016). They are also
    # NFR-01's per-arch floors (ADR-0080).
    inputs:
      rate_x64:
        description: Target rate on x64, requests per second
        type: number
        default: 4600
      rate_arm64:
        description: Target rate on arm64, requests per second
        type: number
        default: 8800
      gate:
        description: Gate the run set against its baselines (NFR-05)
        type: boolean
        default: false
      mode:
        description: throughput (NFR-01, NFR-05) or scaling (NFR-02, never gated; the rates are each arch's rate per vCPU)
        type: choice
        options: [throughput, scaling]
        default: throughput

permissions:
  contents: write # push to bench-results (ADR-0003)

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A scheduled run has no inputs: it uses the default rates.
          - runner: ubuntu-latest
            rate: ${{ inputs.rate_x64 || 4600 }}
          - runner: ubuntu-24.04-arm
            rate: ${{ inputs.rate_arm64 || 8800 }}
    runs-on: ${{ matrix.runner }}
    # Two run sets and their builds; a scaling run is probes and two run
    # sets (ADR-0074 §D9).
    timeout-minutes: ${{ inputs.mode == 'scaling' && 75 || 100 }}
    env:
      GATE: ${{ (github.event_name == 'schedule' || inputs.gate) && inputs.mode != 'scaling' }}
      MODE: ${{ inputs.mode || 'throughput' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the write token goes to the push step only
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/benchgate" ./cmd/benchgate
      # Fetched once, before the first run set, so a re-run is judged against
      # the same baselines. The repository is public, so no token is needed.
      - name: Fetch bench-results and the last release tag
        if: env.GATE == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bench-results"
          # A network error fails the step; only a missing branch means no
          # history.
          if [ -n "$(git ls-remote --heads origin bench-results)" ]; then
            git fetch -q --depth 1 origin bench-results
            git archive FETCH_HEAD results | tar -x -C "$RUNNER_TEMP/bench-results"
          fi
          # The newest v* tag by version sort, and its commit (peeled for an
          # annotated tag).
          refs=$(git ls-remote --tags origin)
          tag=$(awk '{print $2}' <<<"$refs" | grep '^refs/tags/v' | grep -v '\^{}$' | sed 's|^refs/tags/||' | sort -V | tail -n 1 || true)
          if [ -n "$tag" ]; then
            commit=$(awk -v r="refs/tags/$tag^{}" '$2 == r {print $1}' <<<"$refs")
            [ -n "$commit" ] || commit=$(awk -v r="refs/tags/$tag" '$2 == r {print $1}' <<<"$refs")
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
            echo "last release: $tag at $commit"
          else
            echo "no release tag yet: only the nightly baseline applies"
          fi
      - name: 5 runs of 30 s warm-up and 3 min measured
        if: env.MODE != 'scaling'
        env:
          BENCH_RATE: ${{ matrix.rate }}
        run: test/load/bench.sh > result.json
      - name: Scaling run, gateway on 1 then 2 vCPUs
        if: env.MODE == 'scaling'
        env:
          BENCH_RATE: ${{ matrix.rate }}
        run: |
          # EXPLORATORY (task nfr-scaling): diagnostics only; stops before the gate, so nothing is stored.
          test/load/scaling-diag.sh | tee diag.txt
          { echo '### EXPLORATORY diagnostics, not an NFR-02 result'; echo '```'; cat diag.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 1
          test/load/scaling.sh > result.json
          jq -r '"### Scaling (NFR-02), \(.arch): \(if .valid then (if .pass then "PASS" else "FAIL" end) else "INVALID" end)\n",
            "- CPU model: **\(.hardware.cpu_model)**; commit \(.commit[:7]) on `\(.ref)`",
            "- R(1) = \(.n1.r) rps (P \(.n1.p | round)), R(2) = \(.n2.r) rps (P \(.n2.p | round)); S = R(2) ÷ R(1) = \(.scaling // "n/a"), pass at >= 1.70",
            (.n1, .n2 | .gateway_vcpus as $n | .probes | to_entries[] | "- n=\($n) probe \(.key + 1): \(.value.rps_2xx | round) 2xx/s; vCPU gateway \(.value.vcpu.gateway * 100 | round / 100), loadgen \(.value.vcpu.loadgen * 100 | round / 100), upstream \(.value.vcpu.upstream * 100 | round / 100); gateway-bound \(.value.gateway_bound)"),
            (.invalid_reasons[] | "- invalid: \(.)")' result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Gate the run set
        id: gate
        run: |
          args=(-candidate result.json -out result.json -summary "$GITHUB_STEP_SUMMARY")
          if [ "$MODE" = scaling ]; then
            # Never gated; its own summary is already written.
            args=(-candidate result.json -out result.json -ungated)
          elif [ "$GATE" = true ]; then
            args+=(-results "$RUNNER_TEMP/bench-results")
            if [ -n "${RELEASE_TAG:-}" ]; then args+=(-release-tag "$RELEASE_TAG" -release-commit "$RELEASE_COMMIT"); fi
          else
            args+=(-ungated)
          fi
          code=0
          "$RUNNER_TEMP/benchgate" "${args[@]}" > verdict.json || code=$?
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "verdict=$(jq -r .verdict verdict.json)" >> "$GITHUB_OUTPUT"
      # NFR-05's one confirming re-run of a flagged run set, on the same
      # runner (ADR-0073 §D8).
      - name: Re-run the flagged run set once
        id: rerun
        if: steps.gate.outputs.verdict == 'flagged'
        env:
          BENCH_RATE: ${{ matrix.rate }}
        run: |
          test/load/bench.sh > rerun.json
          args=(-results "$RUNNER_TEMP/bench-results" -candidate rerun.json -out rerun.json -rerun-of result.json -summary "$GITHUB_STEP_SUMMARY")
          if [ -n "${RELEASE_TAG:-}" ]; then args+=(-release-tag "$RELEASE_TAG" -release-commit "$RELEASE_COMMIT"); fi
          code=0
          "$RUNNER_TEMP/benchgate" "${args[@]}" > verdict.json || code=$?
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "verdict=$(jq -r .verdict verdict.json)" >> "$GITHUB_OUTPUT"
      # Commits the files onto bench-results without a checkout, creating the
      # branch on the first run, and retries when the other architecture's
      # job pushed first. A flagged first run set is stored even when its
      # re-run could not finish.
      - name: Push the results to bench-results
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN: ${{ steps.rerun.outcome }}
        run: |
          auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)")
          files=(result.json)
          if [ "$RERUN" = success ]; then files+=(rerun.json); fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          entries=()
          for f in "${files[@]}"; do
            entries+=("100644,$(git hash-object -w "$f"),results/$(jq -r .arch "$f")/$(jq -r '.timestamp | gsub("[-:]"; "")' "$f").json")
          done
          export GIT_INDEX_FILE="$RUNNER_TEMP/bench-index"
          for attempt in 1 2 3 4 5; do
            rm -f "$GIT_INDEX_FILE"
            parent=()
            if git "${auth[@]}" fetch -q --depth 1 origin bench-results; then
              git read-tree FETCH_HEAD
              parent=(-p "$(git rev-parse FETCH_HEAD)")
            fi
            for e in "${entries[@]}"; do git update-index --add --cacheinfo "$e"; done
            commit=$(git commit-tree "$(git write-tree)" "${parent[@]}" -m "bench: ${entries[*]##*,}")
            if git "${auth[@]}" push -q origin "$commit:refs/heads/bench-results"; then
              printf 'stored %s on bench-results\n' "${entries[@]##*,}"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Fail an invalid run set or a confirmed regression
        env:
          RERUN_VERDICT: ${{ steps.rerun.outputs.verdict }}
        run: |
          jq -e .valid result.json >/dev/null || { jq -r '.invalid_reasons[]' result.json; exit 1; }
          if [ "$MODE" = scaling ]; then
            jq -e .pass result.json >/dev/null || { jq -r '"NFR-02: S = \(.scaling), below 1.70"' result.json; exit 1; }
          fi
          case "$RERUN_VERDICT" in
            fail) echo "NFR-05: the re-run confirmed the regression (see the job summary)"; exit 1 ;;
            invalid) jq -r '.invalid_reasons[]' rerun.json; exit 1 ;;
          esac
